# SMRITI Platform Registry — Document Model Map
# ===========================================================================
# Maps SMRITI business model names to the underlying platform DocType names.
#
# Rules:
#   1. Never reference platform DocType names outside core/platform/.
#   2. SMRITI services, studios, and UI use SMRITI model names only.
#   3. Only core/platform/registry.py reads this file.
#   4. To migrate to a new platform: update 'platform' values here only.
#   5. To add a new SMRITI model: add a new entry with 'platform' and 'description'.
#
# Format:
#   <SmritiModelName>:
#     platform: <ERPNext DocType Name>
#     description: <Human-readable description>
#
# Author:  Jawahar R. Mallah <jawahar.mallah@gmail.com>
# Version: 1.0.0
# License: GPL-3.0-only
# ===========================================================================

# ── Procurement ──────────────────────────────────────────────────────────────
Purchase:
  platform: Purchase Order
  description: A purchase order raised to a supplier

PurchaseReceipt:
  platform: Purchase Receipt
  description: Goods received note / GRN confirming physical receipt of goods

PurchaseInvoice:
  platform: Purchase Invoice
  description: A supplier invoice for received goods

GoodsReceipt:
  platform: Purchase Receipt
  description: Alias for PurchaseReceipt — use in GRN-specific flows

LandedCost:
  platform: Landed Cost Voucher
  description: Additional costs applied to a purchase receipt (freight, customs, etc.)

# ── Sales ─────────────────────────────────────────────────────────────────────
Sale:
  platform: POS Invoice
  description: A retail sale at the point of sale terminal

SalesOrder:
  platform: Sales Order
  description: A pre-sale order (non-POS, B2B or order-ahead flows)

SalesInvoice:
  platform: Sales Invoice
  description: A formal tax invoice for a completed sale

ReturnSale:
  platform: POS Invoice
  description: A POS return / credit note (is_return = 1)

# ── Inventory ─────────────────────────────────────────────────────────────────
StockTransfer:
  platform: Stock Entry
  description: Internal stock movement between warehouses

StockAudit:
  platform: Stock Reconciliation
  description: Physical stock count / audit reconciliation

StockLedgerEntry:
  platform: Stock Ledger Entry
  description: Read-only stock movement record (source of truth for inventory)

