<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted — SMRITI</title>
    <link rel="icon" href="/assets/smriti_retail_os/images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: url('/assets/smriti_retail_os/images/login_wallpaper.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            width: 440px;
            text-align: center;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .logo-row img {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        }
        .brand-text {
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        .brand-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #14b8a6;
            letter-spacing: 1.5px;
            margin-top: 2px;
            line-height: 1;
        }
        .code {
            font-family: 'Outfit', sans-serif;
            font-size: 84px;
            font-weight: 800;
            background: linear-gradient(135deg, #14b8a6 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 10px 0;
            letter-spacing: -2px;
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            color: #ffffff;
            margin: 12px 0 8px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn-return {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #14b8a6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.2);
        }
        .btn-return:hover {
            background: #0d9488;
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.3);
            transform: translateY(-1px);
        }
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-row">
        <img src="/assets/smriti_retail_os/images/logo.svg" alt="SMRITI Logo" onerror="this.style.display='none'">
        <div class="brand-text">
            <div class="brand-title">SMRITI</div>
            <div class="brand-subtitle">RETAIL OS</div>
        </div>
    </div>
    
    <div class="code">403</div>
    <h2>Access Restricted</h2>
    <p>You don't have permission to view this area.</p>
    
    <a href="/smriti" class="btn-return">Return to SMRITI</a>
    
    <div class="footer">© PrathamOne / AITDL — SMRITI Retail OS</div>
</div>
</body>
</html>
