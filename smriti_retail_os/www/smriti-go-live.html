<!DOCTYPE html>
<!--
  @file: smriti_retail_os/www/smriti-go-live.html
  @description: SMRITI Go-Live Readiness Checklist — real-time system readiness dashboard.
  @version: 1.0.0
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Live Readiness — SMRITI Retail OS</title>
    <meta name="description" content="SMRITI Go-Live Readiness Checklist — verify all system prerequisites before store launch.">
    <link rel="icon" href="/assets/smriti_retail_os/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="/assets/smriti_retail_os/css/smriti_branding.css">
    <script src="/assets/smriti_retail_os/js/smriti_sidebar_standalone.js?v=2.0.6"></script>
<style>
:root {
    --navy:     #1A2B5C;
    --blue:     #2563EB;
    --blue-lt:  #3B82F6;
    --surface:  #0F172A;
    --card:     #1E293B;
    --card2:    #162032;
    --border:   #2D3F5E;
    --text:     #F1F5F9;
    --text-sub: #94A3B8;
    --pass:     #10B981;
    --warn:     #F59E0B;
    --fail:     #EF4444;
    --info:     #6366F1;
    --pass-bg:  rgba(16,185,129,.12);
    --warn-bg:  rgba(245,158,11,.12);
    --fail-bg:  rgba(239,68,68,.12);
    --info-bg:  rgba(99,102,241,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;display:flex}
.icon{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}

/* ── Layout ── */
#app{display:flex;width:100%;min-height:100vh}
#sidebar-container{width:240px;flex-shrink:0}
.main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0;padding:28px 32px;gap:24px;overflow-y:auto}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:1.5rem;font-weight:700;color:var(--text)}
.breadcrumb{font-size:.8rem;color:var(--text-sub);display:flex;align-items:center;gap:6px}
.breadcrumb span{color:var(--text-sub)}
.breadcrumb a{color:var(--blue-lt);text-decoration:none}
.refresh-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text-sub);font-size:.85rem;font-family:inherit;cursor:pointer;transition:all .2s}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue-lt);background:rgba(37,99,235,.08)}
.refresh-btn.spinning .icon{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Overall banner ── */
.overall-banner{border-radius:16px;padding:24px 28px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;border:1px solid}
.overall-banner.READY    {background:var(--pass-bg);border-color:var(--pass)}
.overall-banner.CAUTION  {background:var(--warn-bg);border-color:var(--warn)}
.overall-banner.NOT_READY{background:var(--fail-bg);border-color:var(--fail)}
.overall-banner::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;opacity:.06}
.overall-banner.READY    ::before{background:var(--pass)}
.overall-banner.CAUTION  ::before{background:var(--warn)}
.overall-banner.NOT_READY::before{background:var(--fail)}
.banner-icon{font-size:2.5rem!important;flex-shrink:0}
.banner-icon.READY    {color:var(--pass)}
.banner-icon.CAUTION  {color:var(--warn)}
.banner-icon.NOT_READY{color:var(--fail)}
.banner-text h2{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.banner-text p{font-size:.85rem;color:var(--text-sub)}
.banner-pills{margin-left:auto;display:flex;gap:10px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.PASS{background:var(--pass-bg);color:var(--pass);border:1px solid rgba(16,185,129,.3)}
.pill.WARN{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.pill.FAIL{background:var(--fail-bg);color:var(--fail);border:1px solid rgba(239,68,68,.3)}
.pill.INFO{background:var(--info-bg);color:var(--info);border:1px solid rgba(99,102,241,.3)}

/* ── Progress bar ── */
.progress-wrap{background:var(--card);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;border:1px solid var(--border)}
.progress-label{font-size:.8rem;color:var(--text-sub);white-space:nowrap;min-width:90px}
.progress-bar-bg{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.progress-pct{font-size:.85rem;font-weight:600;color:var(--text);min-width:36px;text-align:right}

/* ── Groups ── */
.groups{display:flex;flex-direction:column;gap:20px}
.group-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.group-header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border)}
.group-icon{font-size:18px!important;color:var(--blue-lt)}
.group-title{font-size:.9rem;font-weight:600;color:var(--text)}
.group-count{margin-left:auto;font-size:.75rem;color:var(--text-sub);background:rgba(255,255,255,.06);padding:2px 10px;border-radius:999px}

/* ── Check rows ── */
.checks-list{display:flex;flex-direction:column}
.check-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
.check-row:last-child{border-bottom:none}
.check-row:hover{background:rgba(255,255,255,.025)}
.status-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.status-dot.PASS{background:var(--pass-bg);color:var(--pass)}
.status-dot.WARN{background:var(--warn-bg);color:var(--warn)}
.status-dot.FAIL{background:var(--fail-bg);color:var(--fail)}
.status-dot.INFO{background:var(--info-bg);color:var(--info)}
.status-dot .icon{font-size:16px!important}
.check-body{flex:1;min-width:0}
.check-label{font-size:.875rem;font-weight:600;color:var(--text);margin-bottom:3px}
.check-msg{font-size:.78rem;color:var(--text-sub);line-height:1.5}
.check-action{margin-left:auto;flex-shrink:0}
.action-link{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:6px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.3);color:var(--blue-lt);font-size:.75rem;font-weight:500;text-decoration:none;transition:all .2s;white-space:nowrap}
.action-link:hover{background:rgba(37,99,235,.2);border-color:var(--blue)}
.action-link .icon{font-size:13px!important}

/* ── Skeleton loader ── */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:14px;width:100%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-banner{height:80px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-row{height:58px;border-radius:0;border-bottom:1px solid rgba(255,255,255,.04)}

/* ── Last run ── */
.last-run{font-size:.75rem;color:var(--text-sub);text-align:right}

/* ── Responsive ── */
@media(max-width:768px){
    .main-wrapper{padding:16px}
    .banner-pills{display:none}
    .progress-wrap{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">

        <!-- Topbar -->
        <div class="topbar">
            <div class="topbar-left">
                <div>
                    <div class="breadcrumb">
                        <a href="/smriti">Home</a>
                        <span>›</span>
                        <span>Go-Live Readiness</span>
                    </div>
                    <h1 class="page-title">
                        <span class="icon" style="vertical-align:middle;margin-right:8px;color:var(--blue-lt)">rocket_launch</span>
                        Go-Live Readiness Checklist
                    </h1>
                </div>
            </div>
            <button class="refresh-btn" id="refresh-btn" onclick="loadChecklist()">
                <span class="icon">refresh</span>
                Re-run Checks
            </button>
        </div>

        <!-- Overall banner (populated by JS) -->
        <div id="overall-banner" class="skeleton-banner"></div>

        <!-- Progress bar -->
        <div class="progress-wrap" id="progress-wrap" style="display:none">
            <span class="progress-label">Readiness Score</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width:0%;background:var(--pass)"></div>
            </div>
            <span class="progress-pct" id="progress-pct">—</span>
        </div>

        <!-- Groups -->
        <div class="groups" id="groups-container">
            <!-- skeleton groups -->
            <div class="group-card">
                <div class="group-header"><div class="skeleton" style="width:120px;height:12px"></div></div>
                <div class="checks-list">
                    <div class="skeleton-row" style="background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.05) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite"></div>
                    <div class="skeleton-row" style="background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.05) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite"></div>
                </div>
            </div>
        </div>

        <div class="last-run" id="last-run"></div>

    </div><!-- /main-wrapper -->
</div><!-- /app -->

<script>
const CSRF = '{{ csrf_token }}';
const API  = 'smriti_retail_os.api.golive_api';

const STATUS_ICON = { PASS: 'check_circle', WARN: 'warning', FAIL: 'cancel', INFO: 'info' };
const GROUP_ICON  = {
    'Licensing':          'license',
    'Store Setup':        'store',
    'Users & Security':   'shield_person',
    'Catalogue & Pricing':'inventory_2',
    'Infrastructure':     'cloud_done',
};

async function api(method, params = {}) {
    const r = await fetch(`/api/method/${method}`, {
        method: 'GET', credentials: 'include',
        headers: { 'Accept': 'application/json' }
    });
    const d = await r.json();
    if (d.exc || d.exc_type) throw new Error(d._error_message || d.exc_type || 'Server error');
    return d.message;
}


function renderBanner(data) {
    const icons = { READY: 'rocket_launch', CAUTION: 'warning_amber', NOT_READY: 'dangerous' };
    const labels = { READY: 'Ready for Go-Live', CAUTION: 'Review Warnings', NOT_READY: 'Not Ready' };
    const el = document.getElementById('overall-banner');
    el.className = `overall-banner ${data.overall}`;
    el.innerHTML = `
        <span class="icon banner-icon ${data.overall}">${icons[data.overall] || 'help'}</span>
        <div class="banner-text">
            <h2>${labels[data.overall] || data.overall}</h2>
            <p>${data.overall_msg}</p>
        </div>
        <div class="banner-pills">
            ${data.totals.PASS ? `<div class="pill PASS"><span class="icon" style="font-size:14px">check_circle</span>${data.totals.PASS} Passed</div>` : ''}
            ${data.totals.WARN ? `<div class="pill WARN"><span class="icon" style="font-size:14px">warning</span>${data.totals.WARN} Warnings</div>` : ''}
            ${data.totals.FAIL ? `<div class="pill FAIL"><span class="icon" style="font-size:14px">cancel</span>${data.totals.FAIL} Failed</div>` : ''}
            ${data.totals.INFO ? `<div class="pill INFO"><span class="icon" style="font-size:14px">info</span>${data.totals.INFO} Info</div>` : ''}
        </div>`;
}

function renderProgress(data) {
    const total = Object.values(data.totals).reduce((a, b) => a + b, 0);
    const passed = data.totals.PASS || 0;
    const pct = total ? Math.round((passed / total) * 100) : 0;
    const color = pct === 100 ? 'var(--pass)' : pct >= 70 ? 'var(--warn)' : 'var(--fail)';
    document.getElementById('progress-wrap').style.display = 'flex';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-fill').style.background = color;
    document.getElementById('progress-pct').textContent = pct + '%';
}

function renderGroups(data) {
    const container = document.getElementById('groups-container');
    // Deduplicate group_order
    const seen = new Set();
    const groupOrder = [];
    for (const g of (data.group_order || [])) {
        if (!seen.has(g)) { seen.add(g); groupOrder.push(g); }
    }

    container.innerHTML = groupOrder.map(groupName => {
        const checks = data.groups[groupName] || [];
        const groupStatus = checks.some(c => c.status === 'FAIL') ? 'FAIL'
                          : checks.some(c => c.status === 'WARN') ? 'WARN'
                          : 'PASS';
        const icon = GROUP_ICON[groupName] || 'folder';

        const rows = checks.map(c => `
            <div class="check-row">
                <div class="status-dot ${c.status}">
                    <span class="icon">${STATUS_ICON[c.status] || 'help'}</span>
                </div>
                <div class="check-body">
                    <div class="check-label">${c.label}</div>
                    <div class="check-msg">${c.message}</div>
                </div>
                ${c.action ? `
                <div class="check-action">
                    <a class="action-link" href="${c.action}">
                        <span class="icon">open_in_new</span>Fix
                    </a>
                </div>` : ''}
            </div>`).join('');

        return `
            <div class="group-card">
                <div class="group-header">
                    <span class="icon group-icon">${icon}</span>
                    <span class="group-title">${groupName}</span>
                    <span class="group-count">${checks.length} check${checks.length !== 1 ? 's' : ''}</span>
                    <span class="icon" style="font-size:16px;color:var(--${groupStatus.toLowerCase()});margin-left:8px">${STATUS_ICON[groupStatus]}</span>
                </div>
                <div class="checks-list">${rows}</div>
            </div>`;
    }).join('');
}

async function loadChecklist() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    btn.disabled = true;

    try {
        const data = await api(`${API}.get_checklist`);
        renderBanner(data);
        renderProgress(data);
        renderGroups(data);
        document.getElementById('last-run').textContent =
            'Last checked: ' + new Date().toLocaleTimeString();
    } catch(e) {
        document.getElementById('overall-banner').className = 'overall-banner NOT_READY';
        document.getElementById('overall-banner').innerHTML = `
            <span class="icon banner-icon NOT_READY">error</span>
            <div class="banner-text">
                <h2>Check Failed</h2>
                <p>Could not load readiness data: ${e.message}</p>
            </div>`;
    } finally {
        btn.classList.remove('spinning');
        btn.disabled = false;
    }
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
    if (typeof initSmritiSidebar === 'function') {
        initSmritiSidebar({
            activePage: 'go-live',
            pageTitle: 'Go-Live Readiness',
        });
    }
    loadChecklist();
});
</script>
</body>
</html>
