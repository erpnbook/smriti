<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMRITI Purchase Studio</title>
<meta name="description" content="SMRITI Purchase Studio — unified purchase operations: orders, GRN, invoices, returns, supplier ledger, analytics."/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/x-icon" href="/assets/smriti_retail_os/images/smriti-favicon.ico"/>
<style>
/* ═══════════════════════════════════════════════════════
   SMRITI DESIGN SYSTEM — Purchase Studio v2.0
═══════════════════════════════════════════════════════ */
:root {
  --bg:         #080e1c;
  --surface:    #0f1729;
  --surface-2:  #131e35;
  --surface-3:  #1a2847;
  --surface-4:  #1e3057;
  --border:     rgba(255,255,255,0.07);
  --border-h:   rgba(37,99,235,0.4);
  --primary:    #2563EB;
  --primary-h:  #3b74f7;
  --primary-g:  linear-gradient(135deg,#2563EB,#7c3aed);
  --navy:       #1A2B5C;
  --success:    #10b981;
  --warning:    #f59e0b;
  --danger:     #ef4444;
  --info:       #38bdf8;
  --purple:     #8b5cf6;
  --text:       #e2e8f0;
  --muted:      #64748b;
  --muted-h:    #94a3b8;
  --nav-w:      248px;
  --top-h:      56px;
  --radius:     12px;
  --radius-sm:  8px;
  --shadow:     0 8px 32px rgba(0,0,0,0.5);
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.3);
  --glow:       0 0 20px rgba(37,99,235,0.15);
  font-family: Arial, Helvetica, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;}
a{color:var(--primary);text-decoration:none;}
button{cursor:pointer;font-family:Arial,Helvetica,sans-serif;border:none;outline:none;}
input,select,textarea{font-family:Arial,Helvetica,sans-serif;outline:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}

/* ── SHELL ──────────────────────────────────────────────── */
#shell{display:flex;height:100vh;overflow:hidden;}

/* ── LEFT NAV ───────────────────────────────────────────── */
#nav{
  width:var(--nav-w);flex-shrink:0;
  background:linear-gradient(180deg,#0c1526 0%,#080e1c 100%);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;z-index:50;
  transition:width 0.2s;
}
#nav-logo{
  padding:18px 16px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#nav-logo img{width:30px;height:30px;border-radius:8px;flex-shrink:0;}
#logo-text{line-height:1.2;}
#logo-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.2px;}
#logo-sub{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
#nav-links{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none;}
#nav-links::-webkit-scrollbar{display:none;}
.nav-sep{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);padding:14px 16px 4px;opacity:0.7;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:500;
  transition:all 0.15s;border-left:3px solid transparent;
  border-radius:0;user-select:none;white-space:nowrap;
  text-overflow:ellipsis;overflow:hidden;
}
.nav-item:hover{background:rgba(37,99,235,0.06);color:var(--muted-h);}
.nav-item.active{
  background:linear-gradient(90deg,rgba(37,99,235,0.15),transparent);
  color:var(--primary);border-left-color:var(--primary);font-weight:600;
}
.nav-item .ni{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;
  font-size:9px;font-weight:700;border-radius:10px;
  padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0;
}
#nav-footer{
  padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;gap:8px;
}
#nav-user-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--primary-g);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}
#nav-user-name{font-size:12px;color:var(--muted-h);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── MAIN AREA ──────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── TOPBAR ─────────────────────────────────────────────── */
#topbar{
  height:var(--top-h);
  background:rgba(15,23,41,0.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:10px;
  flex-shrink:0;z-index:40;position:sticky;top:0;
}
#breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:1;min-width:0;}
#breadcrumb .bc-sep{opacity:0.4;}
#breadcrumb .bc-cur{color:var(--text);font-weight:600;}
.tb-search{
  position:relative;display:flex;align-items:center;
}
.tb-search-icon{position:absolute;left:10px;color:var(--muted);font-size:13px;pointer-events:none;}
#global-search{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px 7px 32px;font-size:13px;
  color:var(--text);width:210px;transition:all 0.2s;
}
#global-search:focus{border-color:var(--border-h);width:260px;background:var(--surface-3);}
#global-search::placeholder{color:var(--muted);}
.tb-btn{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted-h);border-radius:8px;padding:7px 12px;
  font-size:12px;display:flex;align-items:center;gap:5px;
  transition:all 0.15s;white-space:nowrap;
}
.tb-btn:hover{border-color:var(--border-h);color:var(--primary);}
.tb-btn.primary{
  background:var(--primary-g);border-color:transparent;
  color:#fff;font-weight:600;
  box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.tb-btn.primary:hover{box-shadow:0 4px 14px rgba(37,99,235,0.5);transform:translateY(-1px);}

/* ── CONTENT ────────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;padding:24px;position:relative;}

/* ── SECTION HEADER ─────────────────────────────────────── */
.sec-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px;}
.sec-hdr-left h1{font-size:22px;font-weight:700;color:var(--text);line-height:1.2;}
.sec-hdr-left p{font-size:12px;color:var(--muted);margin-top:3px;}
.sec-hdr-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}

/* ── KPI CARDS ──────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;position:relative;
  transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s;overflow:hidden;
}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--primary-g);opacity:0;transition:opacity 0.2s;
}
.kpi-card:hover{border-color:var(--border-h);transform:translateY(-2px);box-shadow:var(--glow);}
.kpi-card:hover::before{opacity:1;}
.kpi-card.danger{border-color:rgba(239,68,68,0.25);}
.kpi-card.danger::before{background:linear-gradient(90deg,var(--danger),#fca5a5);opacity:1;}
.kpi-card.success{border-color:rgba(16,185,129,0.25);}
.kpi-card.success::before{background:linear-gradient(90deg,var(--success),#6ee7b7);opacity:1;}
.kpi-icon{font-size:22px;margin-bottom:10px;display:block;opacity:0.85;}
.kpi-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;}
.kpi-value{font-size:28px;font-weight:700;color:var(--text);margin:6px 0 3px;line-height:1;}
.kpi-value.sm{font-size:20px;}
.kpi-trend{font-size:11px;color:var(--muted);}
.kpi-trend.up{color:var(--success);}
.kpi-trend.dn{color:var(--danger);}

/* ── FILTER BAR ─────────────────────────────────────────── */
.filter-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;flex-wrap:wrap;
}
.f-search{
  flex:1;min-width:160px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:7px;
  padding:7px 11px;font-size:13px;color:var(--text);
}
.f-search:focus{border-color:var(--border-h);}
.f-search::placeholder{color:var(--muted);}
.f-select{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;font-size:13px;color:var(--text);cursor:pointer;
}
.f-select:focus{border-color:var(--border-h);}
.f-date{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;font-size:13px;color:var(--text);color-scheme:dark;
}
.f-btn{
  background:var(--primary);border:none;color:#fff;
  border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;
}
.f-btn:hover{background:var(--primary-h);}
.f-btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:7px;padding:7px 12px;font-size:12px;
}
.f-btn-ghost:hover{border-color:var(--border-h);color:var(--primary);}

/* ── DATA GRID ──────────────────────────────────────────── */
.grid-wrap{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.grid-table{width:100%;border-collapse:collapse;}
.grid-table thead th{
  background:var(--surface-2);font-size:10px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;
  padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;
}
.grid-table tbody tr{
  border-bottom:1px solid var(--border);
  transition:background 0.1s;cursor:pointer;
}
.grid-table tbody tr:last-child{border-bottom:none;}
.grid-table tbody tr:hover{background:rgba(37,99,235,0.05);}
.grid-table tbody td{padding:10px 14px;font-size:13px;color:var(--text);vertical-align:middle;}
.grid-table tbody td.muted{color:var(--muted);}
.grid-empty{text-align:center;padding:56px 20px;color:var(--muted);}
.grid-empty .empty-ico{font-size:42px;margin-bottom:10px;opacity:0.3;display:block;}
.grid-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);
}
.pagination{display:flex;gap:4px;}
.pg-btn{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);border-radius:6px;padding:4px 9px;font-size:12px;
}
.pg-btn:hover,.pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* ── BADGE ──────────────────────────────────────────────── */
.badge{
  display:inline-block;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;
}
.badge-submitted,.badge-approved,.badge-paid,.badge-completed,.badge-received{background:rgba(16,185,129,0.12);color:var(--success);}
.badge-draft,.badge-pending,.badge-to-receive,.badge-to-bill{background:rgba(245,158,11,0.12);color:var(--warning);}
.badge-cancelled,.badge-rejected,.badge-overdue{background:rgba(239,68,68,0.12);color:var(--danger);}
.badge-closed,.badge-on-hold{background:rgba(56,189,248,0.12);color:var(--info);}
.badge-grn-linked{background:rgba(37,99,235,0.12);color:#93c5fd;}
.badge-standalone{background:rgba(139,92,246,0.12);color:#c4b5fd;}

/* ── DETAIL DRAWER ──────────────────────────────────────── */
#drawer{
  position:fixed;top:0;right:-540px;width:540px;height:100vh;
  background:var(--surface);border-left:1px solid var(--border);
  z-index:200;display:flex;flex-direction:column;
  transition:right 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:-12px 0 40px rgba(0,0,0,0.6);
}
#drawer.open{right:0;}
#drawer-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
#drawer-title{font-size:15px;font-weight:700;color:var(--text);}
#drawer-close{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);border-radius:6px;padding:5px 10px;font-size:13px;
  transition:all 0.15s;
}
#drawer-close:hover{color:var(--danger);border-color:var(--danger);}
#drawer-body{flex:1;overflow-y:auto;padding:20px;}
#drawer-actions{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;
}
.d-btn{
  border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;
  border:1px solid var(--border);color:var(--text);background:var(--surface-2);
  transition:all 0.15s;
}
.d-btn:hover{border-color:var(--border-h);color:var(--primary);}
.d-btn.danger{border-color:rgba(239,68,68,0.4);color:var(--danger);}
.d-btn.danger:hover{background:rgba(239,68,68,0.08);}
.d-btn.success{background:var(--success);border-color:var(--success);color:#fff;}
.d-btn.success:hover{background:#0da272;}
.d-btn.primary{background:var(--primary-g);border-color:transparent;color:#fff;}
.d-btn.primary:hover{box-shadow:0 4px 14px rgba(37,99,235,0.4);}
.d-field{margin-bottom:14px;}
.d-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:3px;}
.d-value{font-size:13px;color:var(--text);font-weight:500;}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.d-section{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
  color:var(--muted);border-bottom:1px solid var(--border);
  padding-bottom:6px;margin:18px 0 12px;
}
.mini-table{width:100%;border-collapse:collapse;font-size:12px;}
.mini-table th{
  color:var(--muted);font-size:10px;text-transform:uppercase;
  padding:5px 8px;text-align:left;background:var(--surface-2);
}
.mini-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text);}
.mini-table tr:last-child td{border-bottom:none;}

/* ── MODAL ──────────────────────────────────────────────── */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
#overlay.open{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border-h);
  border-radius:16px;width:700px;max-width:96vw;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
  animation:mIn 0.25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes mIn{from{opacity:0;transform:scale(0.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:700;color:var(--text);}
.modal-steps{display:flex;gap:6px;align-items:center;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all 0.2s;}
.step-dot.active{background:var(--primary);transform:scale(1.2);}
.step-dot.done{background:var(--success);}
.modal-body{flex:1;overflow-y:auto;padding:22px;}
.modal-ftr{
  padding:16px 22px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}
.m-close{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:8px 16px;font-size:13px;
}
.m-close:hover{border-color:var(--danger);color:var(--danger);}
.m-back{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:8px 16px;font-size:13px;
}
.m-next{
  background:var(--primary-g);border:none;color:#fff;
  border-radius:8px;padding:8px 22px;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.m-next:hover{box-shadow:0 4px 16px rgba(37,99,235,0.5);}
.m-next:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}

/* ── FORM FIELDS ────────────────────────────────────────── */
.fg{margin-bottom:16px;}
.fl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block;}
.fl .req{color:var(--danger);}
.fi{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);
  transition:border-color 0.2s;
}
.fi:focus{border-color:var(--border-h);}
.fi::placeholder{color:var(--muted);}
.fi[disabled]{opacity:0.5;cursor:not-allowed;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.typeahead{position:relative;}
.ta-results{
  position:absolute;top:100%;left:0;right:0;z-index:500;
  background:var(--surface-3);border:1px solid var(--border-h);
  border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;
  box-shadow:var(--shadow);
}
.ta-item{
  padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;
  border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
}
.ta-item:hover{background:rgba(37,99,235,0.12);}
.ta-item:last-child{border-bottom:none;}
.ta-sub{font-size:11px;color:var(--muted);}

/* ── ITEM LINE EDITOR ───────────────────────────────────── */
.le-table{width:100%;border-collapse:collapse;font-size:12px;}
.le-table th{
  color:var(--muted);font-size:10px;text-transform:uppercase;
  padding:7px 6px;text-align:left;background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
.le-table td{padding:4px 3px;}
.le-input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:5px;padding:5px 7px;font-size:12px;color:var(--text);
}
.le-input:focus{border-color:var(--border-h);}
.le-del{
  background:transparent;border:none;color:var(--muted);
  font-size:16px;padding:4px 7px;border-radius:4px;line-height:1;
}
.le-del:hover{color:var(--danger);background:rgba(239,68,68,0.1);}
.le-add{
  background:transparent;border:1px dashed var(--border);color:var(--muted);
  border-radius:8px;padding:8px;font-size:12px;width:100%;margin-top:8px;
  transition:all 0.15s;
}
.le-add:hover{border-color:var(--primary);color:var(--primary);}
.le-total{margin-top:10px;text-align:right;font-size:13px;font-weight:600;color:var(--text);}

/* ── BANNER ─────────────────────────────────────────────── */
.banner{
  display:flex;align-items:center;gap:10px;
  border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;
}
.banner.warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);color:#fcd34d;}
.banner.info{background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.25);color:#93c5fd;}
.banner.danger{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
.banner.success{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
.banner-ico{font-size:18px;flex-shrink:0;}

/* ── TOAST ──────────────────────────────────────────────── */
#toasts{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--surface-3);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text);
  min-width:260px;max-width:360px;display:flex;align-items:flex-start;gap:10px;
  box-shadow:var(--shadow);animation:tIn 0.3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes tIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.toast.success{border-left:3px solid var(--success);}
.toast.error{border-left:3px solid var(--danger);}
.toast.warn{border-left:3px solid var(--warning);}
.toast-ico{font-size:18px;flex-shrink:0;margin-top:1px;}
.toast-msg{flex:1;}
.toast-title{font-weight:700;margin-bottom:2px;}
.toast-sub{font-size:12px;color:var(--muted);}

/* ── LOADING ────────────────────────────────────────────── */
.loading{display:flex;align-items:center;justify-content:center;padding:72px;gap:12px;color:var(--muted);}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── ACTIVITY FEED ──────────────────────────────────────── */
.act-feed{display:flex;flex-direction:column;}
.act-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.1s;
}
.act-item:hover{background:rgba(37,99,235,0.05);}
.act-item:last-child{border-bottom:none;}
.act-badge{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.act-badge.PO{background:rgba(37,99,235,0.18);color:#93c5fd;}
.act-badge.GRN{background:rgba(16,185,129,0.18);color:#6ee7b7;}
.act-badge.PI{background:rgba(245,158,11,0.18);color:#fcd34d;}
.act-meta{flex:1;min-width:0;}
.act-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.act-sup{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.act-right{text-align:right;flex-shrink:0;}
.act-amt{font-size:13px;font-weight:600;color:var(--text);}
.act-date{font-size:11px;color:var(--muted);}

/* ── QUICK ACTIONS ──────────────────────────────────────── */
.qa-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 16px;
  color:var(--muted-h);font-size:13px;font-weight:500;
  transition:all 0.15s;text-align:left;width:100%;
}
.qa-btn:hover{border-color:var(--border-h);color:var(--primary);background:rgba(37,99,235,0.05);}
.qa-btn .qa-ico{font-size:20px;width:24px;text-align:center;}

/* ── SETTINGS ───────────────────────────────────────────── */
.settings-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px;margin-bottom:16px;max-width:740px;
}
.settings-card h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;}
.radio-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.radio-opt{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;cursor:pointer;transition:all 0.15s;
  font-size:13px;color:var(--muted);
}
.radio-opt:has(input:checked){border-color:var(--primary);color:var(--primary);background:rgba(37,99,235,0.08);}
.radio-opt input{accent-color:var(--primary);}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid var(--border);
}
.toggle-row:last-child{border-bottom:none;}
.toggle-lbl{font-size:13px;color:var(--text);}
.toggle-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{position:relative;display:inline-block;width:44px;height:24px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .slider{
  position:absolute;cursor:pointer;inset:0;background:var(--surface-3);
  border-radius:24px;border:1px solid var(--border);transition:all 0.2s;
}
.toggle .slider::before{
  content:'';position:absolute;height:18px;width:18px;
  left:2px;bottom:2px;background:var(--muted);
  border-radius:50%;transition:all 0.2s;
}
.toggle input:checked + .slider{background:var(--primary);border-color:var(--primary);}
.toggle input:checked + .slider::before{transform:translateX(20px);background:#fff;}

/* ── ANALYTICS ──────────────────────────────────────────── */
.chart-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.chart-card h3{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;}
.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chart-bar-label{font-size:12px;color:var(--muted);width:120px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-bar-track{flex:1;background:var(--surface-2);border-radius:4px;height:20px;overflow:hidden;position:relative;}
.chart-bar-fill{height:100%;border-radius:4px;background:var(--primary-g);transition:width 0.6s cubic-bezier(0.4,0,0.2,1);position:relative;}
.chart-bar-val{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:#fff;}
.chart-line-svg{width:100%;height:100px;}
.perf-table{width:100%;border-collapse:collapse;}
.perf-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);}
.perf-table td{font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.perf-table tr:last-child td{border-bottom:none;}
.fill-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.fill-bar-inner{height:100%;border-radius:3px;background:var(--success);transition:width 0.5s;}
.fill-bar-inner.warn{background:var(--warning);}
.fill-bar-inner.danger{background:var(--danger);}

/* ── SUPPLIER LEDGER ────────────────────────────────────── */
.ledger-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.ledger-entry-dr{color:var(--danger);}
.ledger-entry-cr{color:var(--success);}

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media(max-width:900px){
  :root{--nav-w:210px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .fr{grid-template-columns:1fr;}
}
@media(max-width:640px){
  #nav{display:none;}
  .kpi-row{grid-template-columns:1fr;}
}

/* ── KEYBOARD SHORTCUT HINT ─────────────────────────────── */
.kb-hint{
  font-size:10px;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;
  font-family:monospace;
}
</style>
</head>
<body>

<!-- ════ MAIN SHELL ════════════════════════════════════════════ -->
<div id="shell">

  <!-- LEFT NAV -->
  <nav id="nav">
    <div id="nav-logo">
      <img src="/assets/smriti_retail_os/images/smriti-logo.png" alt="SMRITI" onerror="this.style.display='none'"/>
      <div id="logo-text">
        <div id="logo-title">SMRITI</div>
        <div id="logo-sub">Purchase Studio</div>
      </div>
    </div>
    <div id="nav-links">
      <div class="nav-sep">Overview</div>
      <div class="nav-item active" data-section="dashboard" onclick="PS.nav('dashboard')">
        <span class="ni">📊</span> Dashboard
      </div>
      <div class="nav-sep">Transactions</div>
      <div class="nav-item" data-section="orders" onclick="PS.nav('orders')">
        <span class="ni">📋</span> Purchase Orders
        <span class="nav-badge" id="badge-orders" style="display:none"></span>
      </div>
      <div class="nav-item" data-section="grn" onclick="PS.nav('grn')">
        <span class="ni">📦</span> GRN / Receipts
      </div>

        <span class="ni">🧾</span> Invoices
        <span class="nav-badge" id="badge-inv" style="display:none">!</span>
      </div>
      <div class="nav-item" data-section="returns" onclick="PS.nav('returns')">
        <span class="ni">↩️</span> Returns
      </div>
      <div class="nav-sep">Finance</div>
      <div class="nav-item" data-section="supplier-ledger" onclick="PS.nav('supplier-ledger')">

        <span class="ni">🚚</span> Landed Cost
      </div>
      <div class="nav-sep">Intelligence</div>
      <div class="nav-item" data-section="analytics" onclick="PS.nav('analytics')">

      </div>

      <div class="nav-item" data-section="settings" onclick="PS.nav('settings')" id="nav-settings" style="display:none">

    <div id="nav-footer">

  <!-- MAIN -->
  <div id="main">
    <!-- TOPBAR -->
    <div id="topbar">
      <div id="breadcrumb">
        <span>Purchase Studio</span>
        <span class="bc-sep">›</span>
        <span class="bc-cur" id="bc-cur">Dashboard</span>
      </div>
      <div class="tb-search">
        <span class="tb-search-icon">🔍</span>
        <input type="text" id="global-search" placeholder="Search… (Ctrl+K)" oninput="PS.globalSearch(this.value)"/>

      <button class="tb-btn" onclick="PS.exportCurrent()" id="btn-export" title="Export CSV">⬇ Export</button>
      <button class="tb-btn" onclick="PS.openDedicatedGrn()" id="btn-grn-new" style="display:none" title="Open dedicated GRN page">📦 New GRN</button>
      <button class="tb-btn primary" onclick="PS.primaryAction()" id="btn-primary" style="display:none">+ New</button>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div class="loading" id="init-loader"><div class="spinner"></div> Loading Purchase Studio…</div>
    </div>
  </div>

<!-- ════ DETAIL DRAWER ════════════════════════════════════════ -->
<div id="drawer">
  <div id="drawer-top">
    <div id="drawer-title">Document</div>

<!-- ════ TOASTS ══════════════════════════════════════════════ -->
<div id="toasts"></div>

<!-- ════ SCRIPT ══════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════
   SMRITI Purchase Studio v2.0
   All API calls: smriti_retail_os.purchase_studio.api.purchase_api.*
   Rule 7: No direct frappe.client.insert / frappe.new_doc from UI.
═══════════════════════════════════════════════════════════════ */

// ── Context injected by smriti-purchase.py ──────────────────
const USER         = "{{ cashier }}";
const USER_ROLES   = {{ user_roles | tojson }};
const CSRF_TOKEN   = "{{ csrf_token }}";
const PX_SETTINGS  = {{ purchase_settings | tojson }};
const API          = "smriti_retail_os.purchase_studio.api.purchase_api";

const IS_MGR  = USER_ROLES.includes("SMRITI Store Manager") || USER_ROLES.includes("System Manager");
const IS_ACC  = USER_ROLES.includes("SMRITI Accounts")      || USER_ROLES.includes("System Manager");
const IS_SYS  = USER_ROLES.includes("System Manager");

// ── API Helper ───────────────────────────────────────────────
function api(method, args={}) {
  return new Promise((resolve, reject) => {
    frappe.call({
      method: method,
      args: args,
      headers: { "X-Frappe-CSRF-Token": CSRF_TOKEN },
      callback: r => resolve(r.message !== undefined ? r.message : r),
      error: e => reject(e)
    });
  });
}

// ── Formatters ───────────────────────────────────────────────
const fmt = {
  cur: v  => "₹" + parseFloat(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),
  pct: v  => parseFloat(v||0).toFixed(1) + "%",
  dt:  v  => v ? new Date(v).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—",
  num: v  => (v||0).toLocaleString("en-IN"),
  trunc: (v,n=28) => v ? (v.length>n ? v.substring(0,n)+"…" : v) : "—"
};

function badge(s) {
  const c = (s||"").toLowerCase().replace(/\s+/g,"-").replace(/\//g,"");
  return `<span class="badge badge-${c}">${s||"—"}</span>`;
}

// ── Toast ────────────────────────────────────────────────────
function toast(type, title, msg, ms=4200) {
  const ico = {success:"✅",error:"❌",warn:"⚠️",info:"ℹ️"};
  const el  = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="toast-ico">${ico[type]||"ℹ️"}</div>
    <div class="toast-msg"><div class="toast-title">${title}</div>
    ${msg?`<div class="toast-sub">${msg}</div>`:""}</div>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ── State ────────────────────────────────────────────────────
const S = {
  section: "dashboard",
  page: 1,
  filters: {},
  modal: { type:null, step:1, maxStep:3, data:{} },
  dash: null
};

// ═══════════════════════════════════════════════════════════════
// PS — Main Controller
// ═══════════════════════════════════════════════════════════════
const PS = {

  init() {
    if (IS_SYS) {
      document.getElementById("nav-settings").style.display = "flex";
      document.getElementById("sys-sep").style.display      = "block";
    }
    const av   = document.getElementById("nav-user-avatar");
    const name = document.getElementById("nav-user-name");
    const short = USER.split("@")[0];
    av.textContent   = short.charAt(0).toUpperCase();
    name.textContent = short;

    // Hash routing
    const hash = (window.location.hash||"").replace("#","").trim() || "dashboard";
    window.addEventListener("hashchange", () => {
      const h = (window.location.hash||"").replace("#","").trim() || "dashboard";
      PS.nav(h, false);
    });
    PS.nav(hash, false);
    PS.loadBadges();

    // Keyboard shortcuts
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey||e.metaKey) && e.key==="k") { e.preventDefault(); document.getElementById("global-search").focus(); }
      if (e.key==="Escape") { PS.closeModal(); PS.closeDrawer(); }
      if ((e.ctrlKey||e.metaKey) && e.key==="n" && IS_MGR) { e.preventDefault(); PS.primaryAction(); }
    });
  },

  nav(section, push=true) {
    S.section = section; S.page = 1; S.filters = {};
    if (push) window.location.hash = section;
    document.querySelectorAll(".nav-item").forEach(el =>
      el.classList.toggle("active", el.dataset.section === section)
    );
    const labels = {
      dashboard:"Dashboard", orders:"Purchase Orders", grn:"GRN / Receipts",
      invoices:"Invoices", returns:"Returns", "supplier-ledger":"Supplier Ledger",
      "landed-cost":"Landed Cost", analytics:"Analytics", suppliers:"Supplier Performance",
      settings:"Settings"
    };
    document.getElementById("bc-cur").textContent = labels[section] || section;

    // Primary button
    const map = { orders:"+ New PO", invoices:"+ New Invoice", returns:"+ New Return" };
    const pBtn = document.getElementById("btn-primary");
    const gBtn = document.getElementById("btn-grn-new");
    const lbl  = IS_MGR ? map[section] : null;
    pBtn.style.display = lbl ? "flex" : "none";
    pBtn.textContent   = lbl || "";
    gBtn.style.display = IS_MGR && section==="grn" ? "flex" : "none";

    PS.render(section);
  },

  async render(section) {
    const el = document.getElementById("content");
    el.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;
    PS.closeDrawer();
    try {
      switch(section) {
        case "dashboard":        await PS.renderDash(el);     break;
        case "orders":           await PS.renderOrders(el);   break;
        case "grn":              await PS.renderGrn(el);      break;
        case "invoices":         await PS.renderInvoices(el); break;
        case "returns":          await PS.renderReturns(el);  break;
        case "supplier-ledger":  await PS.renderLedger(el);   break;
        case "landed-cost":      await PS.renderLCVs(el);     break;
        case "analytics":        await PS.renderAnalytics(el);break;
        case "suppliers":        await PS.renderSupplierPerf(el); break;
        case "settings":         await PS.renderSettings(el); break;
        default: el.innerHTML = `<div class="loading">Section not found.</div>`;
      }
    } catch(e) {
      console.error(e);
      el.innerHTML = `<div class="banner danger" style="margin:20px;">
        <span class="banner-ico">❌</span>
        <span>Failed to load: ${e.exc_type||e.message||"Unknown error"}</span></div>`;
    }
  },

  primaryAction() {
    const map = { orders:"po", invoices:"invoice", returns:"return" };
    const t = map[S.section];
    if (t) PS.openModal(t);
  },

  openDedicatedGrn() {
    window.open("/smriti-grn", "_blank");
  },

  globalSearch(q) {
    clearTimeout(PS._st);
    PS._st = setTimeout(() => { S.filters.search_term = q; S.page = 1; PS.render(S.section); }, 380);
  },

  exportCurrent() {
    toast("info","Export","CSV export launching…",3000);
    // Build CSV from visible table
    const tbl = document.querySelector(".grid-table");
    if (!tbl) return;
    let csv = [];
    tbl.querySelectorAll("thead th").forEach((th,i,arr) => {
      if (i < arr.length-1) csv.push([...csv].length===0 ? [] : csv[csv.length-1]);
    });
    // Simplified export — download visible rows
    const rows = [];
    const hdrs = [...tbl.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    rows.push(hdrs.join(","));
    tbl.querySelectorAll("tbody tr").forEach(tr => {
      const cells = [...tr.querySelectorAll("td")].map(td=>'"'+td.textContent.trim().replace(/"/g,'""')+'"');
      rows.push(cells.join(","));
    });
    const blob = new Blob([rows.join("\n")], {type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `smriti-${S.section}-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  },

  async loadBadges() {
    try {
      const d = await api(`${API}.get_purchase_dashboard`);
      S.dash = d;
      if (d.open_pos>0) { const b=document.getElementById("badge-orders"); b.textContent=d.open_pos; b.style.display=""; }
      if (d.unpaid_invoices_amt>0) { document.getElementById("badge-inv").style.display=""; }
    } catch(e) {}
  },

  // ──────────────────────────────────────────────────────────
  // DASHBOARD
  // ──────────────────────────────────────────────────────────
  async renderDash(el) {
    const d = await api(`${API}.get_purchase_dashboard`);
    S.dash = d;

    el.innerHTML = `
    <div class="sec-hdr">
      <div class="sec-hdr-left">
        <h1>Purchase Dashboard</h1>
        <p>Real-time operations overview — ${fmt.dt(new Date())}</p>
      </div>
      <div class="sec-hdr-actions">
        ${IS_MGR?`<button class="tb-btn primary" onclick="PS.openModal('po')">+ New PO</button>`:""}
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card ${d.open_pos>0?'':'success'}">
        <span class="kpi-icon">📋</span>
        <div class="kpi-label">Open Purchase Orders</div>
        <div class="kpi-value">${fmt.num(d.open_pos)}</div>
        <div class="kpi-trend ${d.open_pos>5?'dn':''}">${d.open_pos>0?'Awaiting receipt':'All clear'}</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-icon">📦</span>
        <div class="kpi-label">Pending GRNs</div>
        <div class="kpi-value">${fmt.num(d.pending_grns)}</div>
        <div class="kpi-trend">Not yet invoiced</div>
      </div>
      <div class="kpi-card ${d.unpaid_invoices_amt>0?'danger':'success'}">
        <span class="kpi-icon">💰</span>
        <div class="kpi-label">Outstanding Payables</div>
        <div class="kpi-value sm">${fmt.cur(d.unpaid_invoices_amt)}</div>
        <div class="kpi-trend dn">${d.unpaid_invoices_amt>0?'Requires payment':''}</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-icon">📅</span>
        <div class="kpi-label">Month Spend</div>
        <div class="kpi-value sm">${fmt.cur(d.month_spend)}</div>
        <div class="kpi-trend">Calendar month total</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:16px;">
      <div>
        <div class="chart-card">
          <h3>📂 Recent Activity</h3>
          <div class="act-feed">
            ${(d.recent_activity||[]).length===0
              ? `<div class="grid-empty"><span class="empty-ico">📭</span>No recent activity</div>`
              : (d.recent_activity||[]).map(a=>`

      document.getElementById("drawer-body").innerHTML = `
        <div class="d-grid">

          <div class="d-field"><div class="d-label">Supplier</div><div class="d-value">${d.supplier_name||d.supplier}</div></div>

            <tr>

              <td>${fmt.num(i.qty)} ${i.uom}</td>
              <td style="color:var(--success);">${fmt.num(i.received_qty)}</td>
              <td style="color:${i.pending_qty>0?'var(--warning)':'var(--muted)'};">${fmt.num(i.pending_qty)}</td>
              <td>${fmt.cur(i.rate)}</td>
              <td>${fmt.cur(i.amount)}</td>
            </tr>`).join("")}
          </tbody>
        </table>`;

      // Actions
      let acts = `<button class="d-btn" onclick="PS.printDoc('PO','${d.name}')">🖨 Print</button>`;

        acts += `<button class="d-btn success" onclick="PS.approveRejectPO('${d.name}','approve')">✅ Approve</button>
                 <button class="d-btn danger"  onclick="PS.approveRejectPO('${d.name}','reject')">❌ Reject</button>`;

      if (IS_MGR && d.per_received<100 && d.status!=="Cancelled") {
        acts += `<button class="d-btn primary" onclick="window.open('/smriti-grn?po=${d.name}','_blank')">📦 Receive (GRN)</button>`;

      document.getElementById("drawer-body").innerHTML = `<div class="banner danger"><span class="banner-ico">❌</span><span>Failed to load: ${e.exc_type||e.message}</span></div>`;
    }

  async approveRejectPO(poName, action) {
    let reason = "";
    if (action==="reject") {
      reason = prompt("Rejection reason (mandatory):");
      if (!reason) return;
    }
    try {
      const r = await api(`${API}.resolve_po_approval`, {po_name: poName, action, reason});
      toast("success", action==="approve"?"PO Approved":"PO Rejected", r.message);
      PS.closeDrawer();
      PS.render("orders");
    } catch(e) {
      toast("error","Error", e.exc||e.message);
    }
  },

  async saveSettings() {
    const fields = {
      purchase_invoice_policy: document.querySelector('input[name="pi_policy"]:checked')?.value || "both",
      approval_threshold: parseFloat(document.getElementById("st-threshold").value||0),
      tolerance_percent:  parseFloat(document.getElementById("st-tolerance").value||0),
      grn_mandatory:      document.getElementById("st-grn-mand").checked,
      allow_over_receipt: document.getElementById("st-over-recv").checked,
      auto_create_items:  document.getElementById("st-auto-item").checked,
    };
    try {
      await api(`${API}.save_purchase_settings`, {fields: JSON.stringify(fields)});
      toast("success","Saved","Purchase settings updated.");
    } catch(e) { toast("error","Error",e.exc||e.message); }
  },

  // ──────────────────────────────────────────────────────────
  // MODAL SYSTEM
  // ──────────────────────────────────────────────────────────
  openModal(type, arg=null) {
    S.modal = { type, step:1, maxStep: type==="po"?3:type==="grn"?2:type==="invoice"?2:1, data:{} };
    if (arg) S.modal.data.prefill = arg;
    document.getElementById("overlay").classList.add("open");
    PS.renderModalStep();
  },
  closeModal() {
    document.getElementById("overlay").classList.remove("open");
    S.modal = { type:null, step:1, maxStep:3, data:{} };
  },
  overlayClick(e) { if (e.target===document.getElementById("overlay")) PS.closeModal(); },
  modalNext() {
    const m = S.modal;
    if (m.step < m.maxStep) { m.step++; PS.renderModalStep(); }
    else PS.submitModal();
  },
  modalBack() {
    if (S.modal.step>1) { S.modal.step--; PS.renderModalStep(); }
  },

  renderModalStep() {
    const m = S.modal;
    // Step dots
    let dots = "";
    for (let i=1; i<=m.maxStep; i++) dots += `<div class="step-dot ${i===m.step?'active':i<m.step?'done':''}"></div>`;
    document.getElementById("modal-steps").innerHTML = dots;
    document.getElementById("m-back").style.display  = m.step>1 ? "inline-flex" : "none";
    document.getElementById("m-next").textContent    = m.step>=m.maxStep ? "Submit" : "Next →";

    const titles = { po:"New Purchase Order", grn:"New GRN / Receipt", invoice:"New Purchase Invoice", return:"Create Purchase Return", lcv:"Add Landed Cost Charges" };
    document.getElementById("modal-title").textContent = titles[m.type]||"Create";

    const body = document.getElementById("modal-body");
    if (m.type==="po")      PS.renderPoStep(body);
    else if (m.type==="invoice") PS.renderInvStep(body);
    else if (m.type==="return")  PS.renderReturnStep(body);
    else if (m.type==="lcv")     PS.renderLcvStep(body);
    else body.innerHTML = `<div class="loading">Not implemented.</div>`;
  },

  // PO CREATION WIZARD
  renderPoStep(body) {
    const m = S.modal;
    if (m.step===1) {
      body.innerHTML = `
      <div class="fg">
        <label class="fl">Supplier <span class="req">*</span></label>
        <div class="typeahead">
          <input type="text" class="fi" id="po-sup-input" placeholder="Type to search supplier…" value="${m.data.supplier_name||""}" oninput="PS.supplierTypeahead(this,'po-sup-res','po-sup-val')"/>
          <div class="ta-results" id="po-sup-res" style="display:none;"></div>
          <input type="hidden" id="po-sup-val" value="${m.data.supplier||""}"/>
        </div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">Schedule Date</label><input type="date" class="fi" id="po-sched" style="color-scheme:dark;" value="${m.data.schedule_date||new Date().toISOString().slice(0,10)}"/></div>
        <div class="fg"><label class="fl">Remarks</label><input type="text" class="fi" id="po-remarks" placeholder="Optional notes…" value="${m.data.remarks||""}"/></div>
      </div>`;
    } else if (m.step===2) {
      if (!m.data.items) m.data.items = [{item_code:"",qty:1,rate:0}];
      body.innerHTML = `
      <div class="fg">
        <label class="fl">Item Search</label>
        <div class="typeahead">
          <input type="text" class="fi" id="po-item-search" placeholder="Search item to add…" oninput="PS.itemTypeahead(this,'po-item-res')"/>
          <div class="ta-results" id="po-item-res" style="display:none;"></div>
        </div>
      </div>
      <table class="le-table" id="po-items-tbl">
        <thead><tr><th style="width:40%">Item Code</th><th>Qty</th><th>Rate (₹)</th><th>Amount</th><th></th></tr></thead>
        <tbody>${PS.renderPoItemRows()}</tbody>
      </table>
      <button class="le-add" onclick="PS.addPoItem()">+ Add Item</button>
      <div class="le-total" id="po-total">Total: ${fmt.cur(PS.calcPoTotal())}</div>
      ${PX_SETTINGS.approval_threshold>0?`<div class="banner warn" style="margin-top:12px;"><span class="banner-ico">🔐</span><span>POs above ${fmt.cur(PX_SETTINGS.approval_threshold)} require approval</span></div>`:""}`;
    } else if (m.step===3) {
      const total = PS.calcPoTotal();
      const needsApproval = PX_SETTINGS.approval_threshold>0 && total>PX_SETTINGS.approval_threshold;
      body.innerHTML = `
      <div class="banner ${needsApproval?'warn':'success'}" style="margin-bottom:16px;">
        <span class="banner-ico">${needsApproval?'🔐':'✅'}</span>
        <span>${needsApproval?'This PO requires manager approval before submission.':'Ready to submit.'}</span>
      </div>
      <div class="d-grid">
        <div class="d-field"><div class="d-label">Supplier</div><div class="d-value">${m.data.supplier_name||m.data.supplier}</div></div>
        <div class="d-field"><div class="d-label">Schedule Date</div><div class="d-value">${fmt.dt(m.data.schedule_date)}</div></div>
        <div class="d-field"><div class="d-label">Items</div><div class="d-value">${m.data.items.length} lines</div></div>
        <div class="d-field"><div class="d-label">Grand Total</div><div class="d-value" style="font-size:20px;font-weight:700;color:var(--primary);">${fmt.cur(total)}</div></div>
      </div>
      ${m.data.remarks?`<div class="d-field"><div class="d-label">Remarks</div><div class="d-value">${m.data.remarks}</div></div>`:""}
      <div class="d-section">Items</div>
      <table class="mini-table">
        <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${m.data.items.map(i=>`<tr><td>${i.item_code}</td><td>${i.qty}</td><td>${fmt.cur(i.rate)}</td><td>${fmt.cur((i.qty||0)*(i.rate||0))}</td></tr>`).join("")}</tbody>
      </table>`;
    }
  },

  renderPoItemRows() {
    return S.modal.data.items.map((it,idx)=>`
    <tr id="po-row-${idx}">
      <td><input type="text" class="le-input" placeholder="Item Code" value="${it.item_code||""}" onchange="S.modal.data.items[${idx}].item_code=this.value;PS.updatePoTotal()"/></td>
      <td><input type="number" class="le-input" value="${it.qty||1}" min="0.001" step="1" onchange="S.modal.data.items[${idx}].qty=parseFloat(this.value)||0;PS.updatePoTotal()"/></td>
      <td><input type="number" class="le-input" value="${it.rate||0}" min="0" step="0.01" onchange="S.modal.data.items[${idx}].rate=parseFloat(this.value)||0;PS.updatePoTotal()"/></td>
      <td style="font-size:12px;font-weight:600;padding-left:6px;">${fmt.cur((it.qty||0)*(it.rate||0))}</td>
      <td><button class="le-del" onclick="S.modal.data.items.splice(${idx},1);document.querySelector('#po-items-tbl tbody').innerHTML=PS.renderPoItemRows();PS.updatePoTotal()">✕</button></td>
    </tr>`).join("");
  },

  addPoItem() {
    S.modal.data.items.push({item_code:"",qty:1,rate:0});
    document.querySelector("#po-items-tbl tbody").innerHTML = PS.renderPoItemRows();
    PS.updatePoTotal();
  },

  calcPoTotal() {
    return (S.modal.data.items||[]).reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.rate)||0),0);
  },

  updatePoTotal() {
    const t = document.getElementById("po-total");
    if (t) t.textContent = "Total: " + fmt.cur(PS.calcPoTotal());
    // Update row amounts
    (S.modal.data.items||[]).forEach((it,idx)=>{
      const row = document.getElementById(`po-row-${idx}`);
      if (row) row.querySelectorAll("td")[3].textContent = fmt.cur((it.qty||0)*(it.rate||0));
    });
  },

  // INVOICE CREATION
  renderInvStep(body) {
    const m = S.modal;
    if (m.step===1) {
      const canGrn      = PX_SETTINGS.purchase_invoice_policy!=="standalone";
      const canStand    = PX_SETTINGS.purchase_invoice_policy!=="grn_only" && !PX_SETTINGS.grn_mandatory;
      body.innerHTML = `
      <div class="fg"><label class="fl">Invoice Mode <span class="req">*</span></label>
        <div class="radio-group">
          ${canGrn?`<label class="radio-opt"><input type="radio" name="inv_mode" value="grn_linked" ${m.data.mode==="grn_linked"?"checked":""}> GRN Linked</label>`:""}
          ${canStand?`<label class="radio-opt"><input type="radio" name="inv_mode" value="standalone" ${m.data.mode==="standalone"?"checked":""}> Standalone</label>`:""}
        </div>
        ${!canStand?`<div class="banner warn" style="margin-top:10px;"><span class="banner-ico">⚠️</span><span>Standalone invoices are disabled by company policy.</span></div>`:""}
      </div>
      <div class="fg" id="grn-name-fg" style="${m.data.mode!=="standalone"?"":"display:none"}">
        <label class="fl">GRN Reference <span class="req">*</span></label>
        <input type="text" class="fi" id="inv-grn-name" placeholder="Enter GRN number…" value="${m.data.grn_name||""}"/>
      </div>`;
      // Show/hide GRN field based on radio
      body.querySelectorAll('input[name="inv_mode"]').forEach(r=>r.addEventListener("change", ()=>{
        m.data.mode = r.value;
        document.getElementById("grn-name-fg").style.display = r.value==="standalone" ? "none" : "";
      }));
    } else if (m.step===2) {
      if (m.data.mode==="standalone") {
        if (!m.data.items) m.data.items = [{item_code:"",qty:1,rate:0}];
        body.innerHTML = `
        <div class="fg"><label class="fl">Supplier <span class="req">*</span></label>
          <div class="typeahead">
            <input type="text" class="fi" id="inv-sup-input" placeholder="Type to search supplier…" value="${m.data.supplier_name||""}" oninput="PS.supplierTypeahead(this,'inv-sup-res','inv-sup-val')"/>
            <div class="ta-results" id="inv-sup-res" style="display:none;"></div>
            <input type="hidden" id="inv-sup-val" value="${m.data.supplier||""}"/>
          </div>
        </div>
        <table class="le-table" id="inv-items-tbl">
          <thead><tr><th>Item Code</th><th>Qty</th><th>Rate (₹)</th><th>Amount</th><th></th></tr></thead>
          <tbody>${PS.renderInvItemRows()}</tbody>
        </table>
        <button class="le-add" onclick="PS.addInvItem()">+ Add Item</button>
        <div class="le-total" id="inv-total">Total: ${fmt.cur(PS.calcInvTotal())}</div>`;
      } else {
        body.innerHTML = `<div class="banner success"><span class="banner-ico">✅</span><span>Invoice will be created from GRN: <strong>${m.data.grn_name}</strong></span></div>`;
      }
    }
  },

  renderInvItemRows() {
    return S.modal.data.items.map((it,idx)=>`
    <tr id="inv-row-${idx}">
      <td><input type="text" class="le-input" value="${it.item_code||""}" onchange="S.modal.data.items[${idx}].item_code=this.value"/></td>
      <td><input type="number" class="le-input" value="${it.qty||1}" onchange="S.modal.data.items[${idx}].qty=parseFloat(this.value)||0"/></td>
      <td><input type="number" class="le-input" value="${it.rate||0}" onchange="S.modal.data.items[${idx}].rate=parseFloat(this.value)||0"/></td>
      <td style="font-size:12px;font-weight:600;padding-left:6px;">${fmt.cur((it.qty||0)*(it.rate||0))}</td>
      <td><button class="le-del" onclick="S.modal.data.items.splice(${idx},1);document.querySelector('#inv-items-tbl tbody').innerHTML=PS.renderInvItemRows()">✕</button></td>
    </tr>`).join("");
  },
  addInvItem() { S.modal.data.items.push({item_code:"",qty:1,rate:0}); document.querySelector("#inv-items-tbl tbody").innerHTML=PS.renderInvItemRows(); },
  calcInvTotal() { return (S.modal.data.items||[]).reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.rate)||0),0); },

  // RETURN
  renderReturnStep(body) {
    const m = S.modal;
    body.innerHTML = `
    <div class="fg"><label class="fl">GRN Number <span class="req">*</span></label>
      <input type="text" class="fi" id="ret-grn" placeholder="Enter GRN to return against…" value="${m.data.grn_name||m.data.prefill||""}"/>
    </div>
    <div class="fg"><label class="fl">Return Reason <span class="req">*</span> <span style="color:var(--muted);font-weight:400;">(Audit requirement)</span></label>
      <textarea class="fi" id="ret-reason" rows="3" placeholder="Describe the reason for return…"></textarea>
    </div>
    <div class="banner warn"><span class="banner-ico">⚠️</span><span>A full return will be created. Partial returns can be done from GRN detail.</span></div>`;
  },

  // LANDED COST
  renderLcvStep(body) {
    const m = S.modal;
    if (!m.data.charges) m.data.charges = [{description:"Freight Charges",amount:0}];
    body.innerHTML = `
    <div class="fg"><label class="fl">GRN Reference</label>
      <input type="text" class="fi" value="${m.data.grn_name||m.data.prefill||""}" id="lcv-grn" placeholder="GRN number…"/>
    </div>
    <div class="d-section">Charges</div>
    <table class="le-table" id="lcv-tbl">
      <thead><tr><th>Description</th><th>Amount (₹)</th><th></th></tr></thead>
      <tbody>${PS.renderLcvRows()}</tbody>
    </table>
    <button class="le-add" onclick="S.modal.data.charges.push({description:'',amount:0});document.querySelector('#lcv-tbl tbody').innerHTML=PS.renderLcvRows()">+ Add Charge</button>`;
  },

  renderLcvRows() {
    return S.modal.data.charges.map((c,idx)=>`
    <tr>
      <td><input type="text" class="le-input" value="${c.description||""}" placeholder="e.g. Freight" onchange="S.modal.data.charges[${idx}].description=this.value"/></td>
      <td><input type="number" class="le-input" value="${c.amount||0}" min="0" onchange="S.modal.data.charges[${idx}].amount=parseFloat(this.value)||0"/></td>
      <td><button class="le-del" onclick="S.modal.data.charges.splice(${idx},1);document.querySelector('#lcv-tbl tbody').innerHTML=PS.renderLcvRows()">✕</button></td>
    </tr>`).join("");
  },

  // SUBMIT MODAL
  async submitModal() {
    const m = S.modal;
    const btn = document.getElementById("m-next");
    btn.disabled = true; btn.textContent = "Submitting…";
    try {
      if (m.type==="po") {
        // Collect step 1 data if not yet saved
        const supVal   = document.getElementById("po-sup-val");
        const supInput = document.getElementById("po-sup-input");
        if (supVal) m.data.supplier = supVal.value || supInput?.value || m.data.supplier;
        const schedEl  = document.getElementById("po-sched");
        if (schedEl) m.data.schedule_date = schedEl.value;
        const remEl    = document.getElementById("po-remarks");
        if (remEl) m.data.remarks = remEl.value;

        if (!m.data.supplier) { toast("warn","Required","Please select a supplier."); btn.disabled=false; btn.textContent="Submit"; return; }
        const validItems = (m.data.items||[]).filter(i=>i.item_code&&(i.qty||0)>0);
        if (!validItems.length) { toast("warn","Required","Add at least one item with qty > 0."); btn.disabled=false; btn.textContent="Submit"; return; }

        const r = await api(`${API}.create_purchase_order`, {
          supplier: m.data.supplier,
          items: JSON.stringify(validItems),
          schedule_date: m.data.schedule_date||"",
          remarks: m.data.remarks||""
        });
        PS.closeModal();
        toast(r.status==="pending_approval"?"warn":"success",
          r.status==="pending_approval"?"Pending Approval":"PO Created", r.message);
        PS.render("orders");

      } else if (m.type==="invoice") {
        const mode = m.data.mode || document.querySelector('input[name="inv_mode"]:checked')?.value;
        if (!mode) { toast("warn","Required","Select invoice mode."); btn.disabled=false; btn.textContent="Submit"; return; }
        const grnEl = document.getElementById("inv-grn-name");
        if (grnEl) m.data.grn_name = grnEl.value;
        const supEl = document.getElementById("inv-sup-val");
        if (supEl) m.data.supplier = supEl.value;

        const r = await api(`${API}.create_invoice`, {
          mode,
          supplier: m.data.supplier||"",
          grn_name: m.data.grn_name||"",
          items:    JSON.stringify(m.data.items||[])
        });
        PS.closeModal();
        toast("success","Invoice Created", r.message);
        PS.render("invoices");

      } else if (m.type==="return") {
        const grn    = document.getElementById("ret-grn")?.value;
        const reason = document.getElementById("ret-reason")?.value;
        if (!grn||!reason) { toast("warn","Required","GRN and reason are mandatory."); btn.disabled=false; btn.textContent="Submit"; return; }
        const r = await api(`${API}.create_purchase_return`, {grn_name:grn, return_reason:reason});
        PS.closeModal();
        toast("success","Return Created", r.message);
        PS.render("returns");

      } else if (m.type==="lcv") {
        const grn     = document.getElementById("lcv-grn")?.value;
        const charges = m.data.charges.filter(c=>c.amount>0);
        if (!grn||!charges.length) { toast("warn","Required","GRN and at least one charge required."); btn.disabled=false; btn.textContent="Submit"; return; }
        const r = await api(`${API}.create_landed_cost_voucher`, {grn_name:grn, charges:JSON.stringify(charges)});
        PS.closeModal();
        toast("success","LCV Created", r.message);
        PS.render("landed-cost");
      }
    } catch(e) {
      toast("error","Error", e.exc||e.message||"Submission failed");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  },

  // Collect data before navigating steps in PO wizard
  collectPoStep() {
    const m = S.modal;
    if (m.type==="po" && m.step===1) {
      const supVal   = document.getElementById("po-sup-val");
      const supInput = document.getElementById("po-sup-input");
      const schedEl  = document.getElementById("po-sched");
      const remEl    = document.getElementById("po-remarks");
      m.data.supplier      = supVal?.value || supInput?.value || m.data.supplier || "";
      m.data.supplier_name = supInput?.value || m.data.supplier_name || "";
      m.data.schedule_date = schedEl?.value || m.data.schedule_date || "";
      m.data.remarks       = remEl?.value || m.data.remarks || "";
      if (!m.data.supplier) { toast("warn","Required","Please select a supplier."); return false; }
    }
    if (m.type==="invoice" && m.step===1) {
      const modeEl = document.querySelector('input[name="inv_mode"]:checked');
      m.data.mode = modeEl?.value || m.data.mode || "";
      const grnEl = document.getElementById("inv-grn-name");
      if (grnEl) m.data.grn_name = grnEl.value;
      if (!m.data.mode) { toast("warn","Required","Select invoice mode."); return false; }
      if (m.data.mode==="grn_linked" && !m.data.grn_name) { toast("warn","Required","Enter GRN reference."); return false; }
    }
    return true;
  },

  // ──────────────────────────────────────────────────────────
  // DRAWER
  // ──────────────────────────────────────────────────────────
  closeDrawer() { document.getElementById("drawer").classList.remove("open"); },

  // ──────────────────────────────────────────────────────────
  // TYPEAHEADS
  // ──────────────────────────────────────────────────────────
  async supplierTypeahead(input, resultsId, hiddenId) {
    const q = input.value.trim();
    const res = document.getElementById(resultsId);
    if (q.length < 2) { res.style.display="none"; return; }
    const rows = await api(`${API}.search_suppliers`, {query: q});
    if (!rows||!rows.length) { res.style.display="none"; return; }
    res.style.display = "block";
    res.innerHTML = rows.map(r=>`
      <div class="ta-item" onclick="document.getElementById('${hiddenId}').value='${r.name}';document.getElementById('${resultsId.replace('-res','-input').replace('-results','-input')}').value='${(r.supplier_name||r.name).replace(/'/g,"\\'")}';document.getElementById('${resultsId}').style.display='none';">
        <span>${r.supplier_name||r.name}</span>
        <span class="ta-sub">${r.supplier_group||""}</span>
      </div>`).join("");
    document.addEventListener("click", function h(e) {
      if (!res.contains(e.target) && e.target!==input) { res.style.display="none"; document.removeEventListener("click",h); }
    });
  },

  async itemTypeahead(input, resultsId) {
    const q = input.value.trim();
    const res = document.getElementById(resultsId);
    if (q.length < 2) { res.style.display="none"; return; }
    const rows = await api(`${API}.search_items`, {query: q});
    if (!rows||!rows.length) { res.style.display="none"; return; }
    res.style.display = "block";
    res.innerHTML = rows.map(r=>`
      <div class="ta-item" onclick="PS.addPoItemFromSearch('${r.item_code}',${r.standard_rate||0});document.getElementById('${resultsId}').style.display='none';document.getElementById('po-item-search').value='';">
        <span style="font-weight:600;">${r.item_code}</span>
        <span class="ta-sub">${r.item_name||""}</span>
      </div>`).join("");
    document.addEventListener("click", function h(e) {
      if (!res.contains(e.target) && e.target!==input) { res.style.display="none"; document.removeEventListener("click",h); }
    });
  },

  addPoItemFromSearch(itemCode, rate) {
    S.modal.data.items.push({item_code:itemCode, qty:1, rate:rate});
    document.querySelector("#po-items-tbl tbody").innerHTML = PS.renderPoItemRows();
    PS.updatePoTotal();
  },

  // ──────────────────────────────────────────────────────────
  // PRINT
  // ──────────────────────────────────────────────────────────
  printDoc(type, name) {
    toast("info","Print","Print function will open document in a new tab.");
    window.open(`/printview?doctype=${encodeURIComponent(type==="PO"?"Purchase Order":type==="GRN"?"Purchase Receipt":"Purchase Invoice")}&name=${encodeURIComponent(name)}&trigger_print=1`, "_blank");
  }
};

// Override modalNext to collect step data first
const _origNext = PS.modalNext.bind(PS);
PS.modalNext = function() {
  if (PS.collectPoStep && !PS.collectPoStep()) return;
  _origNext();
};

// ── Boot ────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => PS.init());
</script>
</body>
</html>
