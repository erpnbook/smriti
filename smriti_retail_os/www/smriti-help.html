<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Center — SMRITI Retail OS</title>
    <link rel="icon" href="/assets/smriti_retail_os/images/smriti_logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        :root {
            --primary-navy: #1A2B5C;
            --primary-blue: #2563EB;
            --primary-blue-hover: #1D4ED8;
            --text-dark: #0F172A;
            --text-main: #334155;
            --text-muted: #64748B;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-page: #F8FAFC;
            --border-glass: rgba(226, 232, 240, 0.8);
            --shadow-glass: 0 10px 30px rgba(26, 43, 92, 0.04);
            --accent-green: #10B981;
            --accent-yellow: #F59E0B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Top Header Navigation */
        .help-header {
            background: var(--primary-navy);
            color: #FFFFFF;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-section img {
            height: 36px;
        }

        .logo-section h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-header {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-header-primary {
            background: var(--primary-blue);
            color: #FFFFFF;
        }

        .btn-header-primary:hover {
            background: var(--primary-blue-hover);
        }

        /* Layout Container */
        .help-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 32px;
            max-width: 1440px;
            width: 100%;
            margin: 32px auto;
            padding: 0 32px;
            flex: 1;
        }

        /* Left Sidebar (TOC) */
        .help-sidebar {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-glass);
            align-self: start;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .category-group {
            margin-bottom: 24px;
        }

        .category-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary-blue);
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .article-link {
            display: block;
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .article-link:hover {
            background: rgba(37, 99, 235, 0.06);
            color: var(--primary-blue);
        }

        .article-link.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-blue);
            border-left: 4px solid var(--primary-blue);
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* Right Content Panel */
        .help-content {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-glass);
            min-height: 500px;
        }

        /* Document Styling */
        .doc-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-navy);
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-glass);
            padding-bottom: 16px;
        }

        /* Metadata Badge Row */
        .doc-metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .meta-badge {
            background: #F1F5F9;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .meta-badge-author {
            background: #EFF6FF;
            color: var(--primary-blue);
        }

        .doc-section {
            margin-bottom: 40px;
        }

        .doc-section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-navy);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doc-section-title .material-symbols-outlined {
            color: var(--primary-blue);
        }

        .doc-summary {
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 24px;
            background: rgba(37, 99, 235, 0.03);
            border-left: 4px solid var(--primary-blue);
            padding: 16px 20px;
            border-radius: 4px;
        }

        /* Tables */
        .doc-table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .doc-table th {
            background: #F8FAFC;
            color: var(--primary-navy);
            font-weight: 700;
            padding: 14px 16px;
            border-bottom: 2px solid var(--border-glass);
        }

        .doc-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-glass);
            vertical-align: top;
        }

        .doc-table tr:last-child td {
            border-bottom: none;
        }

        .doc-table code {
            font-family: monospace;
            background: #F1F5F9;
            padding: 2px 6px;
            border-radius: 4px;
            color: #D97706;
            font-size: 13px;
        }

        /* Formula Card Grid */
        .formula-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .formula-card {
            background: #FFFFFF;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .formula-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .formula-name {
            font-weight: 700;
            color: var(--primary-navy);
            font-size: 16px;
            margin-bottom: 6px;
        }

        .formula-math {
            font-family: monospace;
            background: #F8FAFC;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--primary-blue);
            font-size: 14px;
            margin-bottom: 10px;
            border-left: 3px solid var(--primary-blue);
        }

        .formula-explanation {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Author Attribution Footer Box */
        .attribution-card {
            background: linear-gradient(135deg, rgba(26,43,92,0.02) 0%, rgba(37,99,235,0.02) 100%);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 24px;
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .attribution-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-navy);
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 8px;
        }

        .attribution-details {
            font-size: 14px;
            color: var(--text-main);
        }

        .attribution-signature {
            font-size: 13px;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Simple content card for plain text article content */
        .article-content-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <header class="help-header">
        <div class="logo-section">
            <img src="/assets/smriti_retail_os/images/smriti_logo.svg" alt="SMRITI" onerror="this.style.display='none'">
            <h1>Help Center</h1>
        </div>
        <div class="nav-links">
            <a href="/smriti" class="btn-header">← Dashboard</a>
            <a href="/reports" class="btn-header btn-header-primary">Reports Center</a>
        </div>
    </header>

    <div class="help-layout">
        <!-- Sidebar TOC -->
        <aside class="help-sidebar" id="help-sidebar">
            <!-- Dynamically Populated -->
        </aside>

        <!-- Main Content Panel -->
        <main class="help-content" id="help-content">
            <div style="display:flex; justify-content:center; align-items:center; height:300px; color:var(--text-muted);">
                <span class="material-symbols-outlined" style="animation: spin 1s linear infinite; margin-right:8px;">sync</span> Loading help articles...
            </div>
        </main>
    </div>

    <script>
        // CSRF Token injected by Frappe server-side template (same pattern as all SMRITI pages)
        const CSRF_TOKEN = '{{ csrf_token }}';

        // Active article key parsed from context or URL query parameter
        let activeArticleKey = '{{ article_key or "" }}' || new URLSearchParams(window.location.search).get('article') || 'inventory_productivity';

        document.addEventListener('DOMContentLoaded', function () {
            loadTOC();
        });

        async function api(method, args = {}) {
            try {
                const response = await fetch(`/api/method/${method}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'x-frappe-csrf-token': CSRF_TOKEN
                    },
                    body: JSON.stringify(args)
                });
                const data = await response.json();
                if (data.exc) {
                    console.error("API exception:", data.exc);
                }
                return data.message;
            } catch (err) {
                console.error("Fetch API error:", err);
            }
        }

        async function loadTOC() {
            const toc = await api('smriti_retail_os.api.help_api.get_help_toc');
            if (!toc) return;

            const sidebar = document.getElementById('help-sidebar');
            sidebar.innerHTML = '';

            let categories = Object.keys(toc);
            categories.forEach(cat => {
                const group = document.createElement('div');
                group.className = 'category-group';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = cat;
                group.appendChild(title);

                toc[cat].forEach(art => {
                    const link = document.createElement('a');
                    link.className = 'article-link';
                    if (art.key === activeArticleKey) {
                        link.className += ' active';
                    }
                    link.href = `?article=${art.key}`;
                    link.textContent = art.title;
                    link.onclick = (e) => {
                        e.preventDefault();
                        window.history.pushState(null, '', `?article=${art.key}`);
                        activeArticleKey = art.key;
                        updateActiveSidebarLink();
                        loadArticle(art.key);
                    };
                    group.appendChild(link);
                });

                sidebar.appendChild(group);
            });

            // Load initial article
            loadArticle(activeArticleKey);
        }

        function updateActiveSidebarLink() {
            const links = document.querySelectorAll('.article-link');
            links.forEach(l => {
                const hrefParams = new URLSearchParams(l.getAttribute('href').split('?')[1]);
                if (hrefParams.get('article') === activeArticleKey) {
                    l.classList.add('active');
                } else {
                    l.classList.remove('active');
                }
            });
        }

        async function loadArticle(key) {
            const contentPanel = document.getElementById('help-content');
            contentPanel.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:300px; color:var(--text-muted);">
                    <span class="material-symbols-outlined" style="animation: spin 1s linear infinite; margin-right:8px;">sync</span> Loading article...
                </div>
            `;

            try {
                const doc = await api('smriti_retail_os.api.help_api.get_help_article', { article_key: key });
                if (!doc) {
                    contentPanel.innerHTML = `<div style="color:red;padding:20px;">Error loading article.</div>`;
                    return;
                }

                let html = `
                    <h1 class="doc-title">${doc.title}</h1>
                    
                    <div class="doc-metadata">
                        <span class="meta-badge"><span class="material-symbols-outlined" style="font-size:14px;">bookmark</span> ${doc.category}</span>
                        ${doc.version ? `<span class="meta-badge"><span class="material-symbols-outlined" style="font-size:14px;">rule</span> Version: ${doc.version}</span>` : ''}
                        ${doc.effective_date ? `<span class="meta-badge"><span class="material-symbols-outlined" style="font-size:14px;">calendar_today</span> Effective: ${doc.effective_date}</span>` : ''}
                        ${doc.smriti_version ? `<span class="meta-badge"><span class="material-symbols-outlined" style="font-size:14px;">terminal</span> OS Version: v${doc.smriti_version}</span>` : ''}
                        ${doc.author ? `<span class="meta-badge meta-badge-author"><span class="material-symbols-outlined" style="font-size:14px;">verified_user</span> ${doc.author.name}</span>` : ''}
                    </div>
                `;

                if (doc.summary) {
                    html += `<div class="doc-summary">${doc.summary}</div>`;
                }

                // Render Formulas if present
                if (doc.formulas && doc.formulas.length > 0) {
                    html += `
                        <div class="doc-section">
                            <h2 class="doc-section-title"><span class="material-symbols-outlined">calculate</span> Calculation Formulas & Logic</h2>
                            <div class="formula-list">
                    `;
                    doc.formulas.forEach(f => {
                        html += `
                            <div class="formula-card" style="margin-bottom: 24px; border: 1px solid var(--border-glass); border-radius: 12px; padding: 24px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(26, 43, 92, 0.02);">
                                <div class="formula-name" style="font-size: 18px; font-weight: 700; color: var(--primary-navy); margin-bottom: 16px; border-bottom: 1px solid var(--border-glass); padding-bottom: 8px;">${f.name}</div>
                                
                                <div style="margin-bottom: 12px;">
                                    <strong style="color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Business Meaning:</strong>
                                    <p style="font-size: 14px; color: var(--text-main); margin-top: 4px;">${f.business_meaning}</p>
                                </div>
                                
                                <div style="margin-bottom: 16px;">
                                    <strong style="color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Formula:</strong>
                                    <div class="formula-math" style="font-family: monospace; background: #F8FAFC; padding: 12px 16px; border-radius: 8px; color: var(--primary-blue); font-size: 15px; font-weight: 600; margin-top: 6px; border-left: 4px solid var(--primary-blue);">${f.formula}</div>
                                </div>
                                
                                <div style="margin-bottom: 12px;">
                                    <strong style="color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Worked Example:</strong>
                                    <p style="font-size: 14px; font-family: monospace; color: #D97706; background: #FFFBEB; padding: 8px 12px; border-radius: 6px; margin-top: 4px; border-left: 3px solid #F59E0B;">${f.example}</p>
                                </div>
                                
                                <div>
                                    <strong style="color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Interpretation:</strong>
                                    <p style="font-size: 14px; color: var(--text-main); margin-top: 4px; font-style: italic;">${f.interpretation}</p>
                                </div>
                            </div>
                        `;
                    });
                    html += `
                            </div>
                        </div>
                    `;
                }

                // Render Classification Rules if present
                if (doc.classification_rules && doc.classification_rules.length > 0) {
                    html += `
                        <div class="doc-section">
                            <h2 class="doc-section-title"><span class="material-symbols-outlined">grid_view</span> SKU Performance Classification</h2>
                            <div class="doc-table-wrapper">
                                <table class="doc-table">
                                    <thead>
                                        <tr>
                                            <th>Category</th>
                                            <th>Velocity Rule</th>
                                            <th>GMROI Rule</th>
                                            <th>Recommended Action</th>
                                            <th>Operational Intent</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;
                    doc.classification_rules.forEach(r => {
                        html += `
                            <tr>
                                <td style="font-weight:700; color:var(--primary-navy);">${r.category}</td>
                                <td><code>${r.velocity}</code></td>
                                <td><code>${r.gmroi}</code></td>
                                <td style="font-weight:700; color:var(--primary-blue);">${r.action}</td>
                                <td style="color:var(--text-muted);">${r.description}</td>
                            </tr>
                        `;
                    });
                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                // Render Confidence Levels if present
                if (doc.confidence_levels && doc.confidence_levels.length > 0) {
                    html += `
                        <div class="doc-section">
                            <h2 class="doc-section-title"><span class="material-symbols-outlined">verified</span> Confidence Indicators</h2>
                            <div class="doc-table-wrapper">
                                <table class="doc-table">
                                    <thead>
                                        <tr>
                                            <th>Confidence Level</th>
                                            <th>Validation Criteria</th>
                                            <th>Reliability Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;
                    doc.confidence_levels.forEach(c => {
                        let levelColor = "var(--text-muted)";
                        if (c.level === "High") levelColor = "var(--accent-green)";
                        else if (c.level === "Medium") levelColor = "var(--accent-yellow)";
                        
                        html += `
                            <tr>
                                <td style="font-weight:700; color:${levelColor};">${c.level}</td>
                                <td><code>${c.criteria}</code></td>
                                <td style="color:var(--text-main);">${c.description}</td>
                            </tr>
                        `;
                    });
                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                // Render Data Quality Warnings if present
                if (doc.data_quality_warnings && doc.data_quality_warnings.length > 0) {
                    html += `
                        <div class="doc-section">
                            <h2 class="doc-section-title"><span class="material-symbols-outlined">warning</span> Data Quality Warnings</h2>
                            <div class="doc-table-wrapper">
                                <table class="doc-table">
                                    <thead>
                                        <tr>
                                            <th>Warning Alert</th>
                                            <th>Trigger Condition</th>
                                            <th>Resolution Action Required</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;
                    doc.data_quality_warnings.forEach(w => {
                        html += `
                            <tr>
                                <td style="font-weight:700; color:#EF4444; display:flex; align-items:center; gap:6px;">
                                    <span class="material-symbols-outlined" style="font-size:18px;">warning</span> ${w.warning}
                                </td>
                                <td><code>${w.trigger}</code></td>
                                <td style="color:var(--text-main);">${w.action}</td>
                            </tr>
                        `;
                    });
                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                // Render plain content if no formulas or tables (e.g. placeholder coming soon articles)
                if (doc.content) {
                    html += `
                        <div class="doc-section">
                            <div class="article-content-text">${doc.content}</div>
                        </div>
                    `;
                }

                // Render About SMRITI Section
                if (doc.about_smriti) {
                    html += `
                        <div class="doc-section" style="margin-top: 48px; padding-top: 32px; border-top: 2px solid var(--border-glass);">
                            <h2 class="doc-section-title"><span class="material-symbols-outlined">info</span> About SMRITI</h2>
                            <p style="font-size: 15px; color: var(--text-main); line-height: 1.8; font-style: italic; background: rgba(26, 43, 92, 0.02); padding: 20px; border-radius: 12px; border: 1px dashed var(--border-glass);">
                                ${doc.about_smriti.replace(/\n/g, '<br>')}
                            </p>
                        </div>
                    `;
                }

                // Render About Attribution Footer Card
                if (doc.about) {
                    html += `
                        <div class="attribution-card" style="margin-top: 40px; padding: 24px; background: linear-gradient(135deg, rgba(26,43,92,0.02) 0%, rgba(37,99,235,0.02) 100%); border: 1px solid var(--border-glass); border-radius: 12px;">
                            <div class="attribution-title" style="font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary-navy); border-bottom: 1px solid var(--border-glass); padding-bottom: 8px; margin-bottom: 12px;">About This Methodology</div>
                            <div class="attribution-details" style="font-size: 14px; color: var(--text-main); line-height: 1.6; margin-bottom: 16px;">${doc.about}</div>
                            ${doc.author ? `
                                <div class="attribution-signature" style="border-top: 1px solid var(--border-glass); padding-top: 12px;">
                                    <strong style="color:var(--primary-navy); font-size:15px;">${doc.author.name}</strong><br>
                                    <span style="color:var(--text-muted); font-size:13px; font-weight:600;">${doc.author.title}</span>
                                    ${doc.author.quote ? `
                                        <blockquote style="font-style: italic; margin-top: 10px; border-left: 3px solid var(--primary-blue); padding-left: 12px; color: var(--text-main); font-size: 14px;">
                                            "${doc.author.quote}"
                                        </blockquote>
                                    ` : ''}
                                </div>
                            ` : ''}
                            ${doc.generated_datetime ? `
                                <div style="margin-top: 16px; font-size: 11px; color: var(--text-muted); text-align: right;">
                                    Last Updated: ${doc.generated_datetime}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }

                contentPanel.innerHTML = html;
            } catch (err) {
                console.error("Error loading article:", err);
                contentPanel.innerHTML = `<div style="color:red;padding:20px;">Exception: Failed to load article data.</div>`;
            }
        }
    </script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
