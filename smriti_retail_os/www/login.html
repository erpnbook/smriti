<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMRITI Retail OS</title>
<link rel="manifest" href="/assets/smriti_retail_os/manifest.json">
<meta name="theme-color" content="#e94560">
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/assets/smriti_retail_os/js/sw.js')
            .then(reg => console.log('[SMRITI] SW registered: ', reg.scope))
            .catch(err => console.log('[SMRITI] SW registration failed: ', err));
    });
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #030712;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* Animated ambient mesh glow background */
.bg-grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(233,69,96,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(233,69,96,0.015) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
}

.bg-glow {
    position: fixed;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(233, 69, 96, 0.1) 0%,
        rgba(99, 102, 241, 0.03) 40%,
        transparent 70%
    );
    top: -200px;
    left: -150px;
    z-index: 0;
    filter: blur(40px);
    animation: float-glow-1 25s ease-in-out infinite alternate;
}

.bg-glow-2 {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(99, 102, 241, 0.08) 0%,
        rgba(13, 148, 136, 0.02) 50%,
        transparent 70%
    );
    bottom: -150px;
    right: -100px;
    z-index: 0;
    filter: blur(40px);
    animation: float-glow-2 30s ease-in-out infinite alternate;
}

@keyframes float-glow-1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(120px, 80px) scale(1.15); }
}

@keyframes float-glow-2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-100px, -60px) scale(1.1); }
}

/* Premium Glassmorphic card container */
.login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 24px;
}

.login-card {
    background: rgba(15, 23, 42, 0.5) !important;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Logo styling with subtle rotation animations */
.brand-area {
    text-align: center;
    margin-bottom: 36px;
}

.brand-logo {
    width: 72px;
    height: 72px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    margin: 0 auto 20px;
    box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.3),
        inset 0 2px 5px rgba(255, 255, 255, 0.1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.brand-logo:hover {
    transform: rotate(180deg) scale(1.08);
    border-color: #ff758f;
    box-shadow: 0 0 30px rgba(255, 117, 143, 0.35);
}

.brand-logo svg {
    width: 100%;
    height: 100%;
}

.brand-name {
    font-family: 'Outfit', sans-serif;
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-name span {
    font-weight: 300;
    color: rgba(255, 255, 255, 0.7);
}

.brand-sub {
    font-size: 0.88rem;
    color: #64748b;
    margin-top: 6px;
    font-weight: 500;
}

/* Fields & Inputs styling */
.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #64748b;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.input-container {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 16px;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s ease;
    pointer-events: none;
}

.input-icon svg {
    width: 18px;
    height: 18px;
}

.form-input {
    width: 100%;
    padding: 14px 16px 14px 48px;
    background: rgba(255, 255, 255, 0.02) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 12px;
    color: #f8fafc !important;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
}

.form-input:hover {
    border-color: rgba(255, 255, 255, 0.15) !important;
    background: rgba(255, 255, 255, 0.04) !important;
}

.form-input:focus {
    border-color: #ff758f !important;
    box-shadow: 0 0 20px rgba(255, 117, 143, 0.15) !important;
    background: rgba(255, 255, 255, 0.05) !important;
}

.input-container:focus-within .input-icon {
    color: #ff758f;
}

.form-input::placeholder {
    color: #334155;
}

/* Chrome/Safari Autofill Styles override to match dark background */
.form-input:-webkit-autofill,
.form-input:-webkit-autofill:hover,
.form-input:-webkit-autofill:focus,
.form-input:-webkit-autofill:active {
    -webkit-text-fill-color: #f8fafc !important;
    -webkit-box-shadow: 0 0 0 1000px rgba(15, 23, 42, 0.95) inset !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    transition: background-color 50000s ease-in-out 0s;
}

.form-input:-webkit-autofill:focus {
    border-color: #ff758f !important;
}

/* Premium Login Action Button with active moving gradient */
.btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 50%, #c71f37 100%);
    background-size: 200% auto;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 0.98rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 24px rgba(255, 77, 109, 0.2);
}

.btn-login:hover {
    transform: translateY(-2px);
    background-position: right center;
    box-shadow: 0 12px 30px rgba(255, 77, 109, 0.4);
}

.btn-login:active {
    transform: translateY(0);
}

/* Error banner */
.error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #f87171;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.88rem;
    margin-bottom: 20px;
    display: none;
    text-align: center;
    font-weight: 500;
}

/* Footer layout */
.login-footer {
    text-align: center;
    margin-top: 32px;
    font-size: 0.8rem;
    color: #475569;
    font-weight: 500;
    letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-area">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#ff758f"/>
                            <stop offset="1" stop-color="#c71f37"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="brand-name">SMRITI <span>Retail OS</span></div>
            <div class="brand-sub">
                Retail Management Platform
            </div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="form-group">
            <label class="form-label">Username</label>
            <div class="input-container">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </span>
                <input 
                    type="text" 
                    id="email" 
                    class="form-input"
                    placeholder="your@email.com"
                    autocomplete="username"
                >
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-container">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                >
            </div>
        </div>

        <button class="btn-login" onclick="doLogin()">
            Sign In →
        </button>

        <div class="login-footer">
            © 2026 SMRITI Retail OS
        </div>
    </div>
</div>

<script>
document.getElementById('password')
    .addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doLogin();
    });

function doLogin() {
    const usr = document.getElementById('email').value;
    const pwd = document.getElementById('password').value;
    const err = document.getElementById('error-msg');
    
    if (!usr || !pwd) {
        err.style.display = 'block';
        err.textContent = 'Please enter credentials';
        return;
    }
    
    err.style.display = 'none';
    
    fetch('/api/method/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Frappe-CSRF-Token': 'fetch'
        },
        body: JSON.stringify({ usr, pwd })
    })
    .then(r => r.json())
    .then(data => {
        if (data.message === 'Logged In') {
            window.location.href = '/app';
        } else {
            err.style.display = 'block';
            err.textContent = 
                'Invalid credentials. Please try again.';
        }
    })
    .catch(() => {
        err.style.display = 'block';
        err.textContent = 'Connection error. Try again.';
    });
}
</script>
</body>
</html>
