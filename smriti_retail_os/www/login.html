<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
      content="width=device-width, initial-scale=1.0">
<title>SMRITI Retail OS</title>
<link rel="manifest" href="/assets/smriti_retail_os/manifest.json">
<meta name="theme-color" content="#e94560">
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/assets/smriti_retail_os/js/sw.js')
            .then(reg => console.log('[SMRITI] SW registered: ', reg.scope))
            .catch(err => console.log('[SMRITI] SW registration failed: ', err));
    });
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #0b0f19;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Animated background */
.bg-grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(233,69,96,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(233,69,96,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
}

.bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(233,69,96,0.08) 0%,
        transparent 70%
    );
    top: -100px;
    left: -100px;
    z-index: 0;
}

.bg-glow-2 {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(99,102,241,0.06) 0%,
        transparent 70%
    );
    bottom: -50px;
    right: -50px;
    z-index: 0;
}

/* Login card */
.login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.login-card {
    background: #16213e;
    border: 1px solid #2a3a5c;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}

/* Logo area */
.brand-area {
    text-align: center;
    margin-bottom: 32px;
}

.brand-logo {
    width: 60px;
    height: 60px;
    background: linear-gradient(
        135deg, #e94560, #c73652
    );
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(233,69,96,0.3);
}

.brand-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: 0.3px;
}

.brand-sub {
    font-size: 0.85rem;
    color: #8892a4;
    margin-top: 4px;
}

/* Form */
.form-group {
    margin-bottom: 20px;
}

.form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: #8892a4;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.form-input {
    width: 100%;
    padding: 12px 16px;
    background: #1a2744;
    border: 1px solid #2a3a5c;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    outline: none;
}

.form-input:focus {
    border-color: #e94560;
    box-shadow: 0 0 0 3px rgba(233,69,96,0.15);
}

.form-input::placeholder {
    color: #4a5568;
}

/* Login button */
.btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(
        135deg, #e94560, #c73652
    );
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: 0.3px;
}

.btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(233,69,96,0.4);
}

.btn-login:active {
    transform: translateY(0);
}

/* Footer */
.login-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.78rem;
    color: #4a5568;
}

/* Error */
.error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #ef4444;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-area">
            <div class="brand-logo">🛒</div>
            <div class="brand-name">SMRITI Retail OS</div>
            <div class="brand-sub">
                Retail Management Platform
            </div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="form-group">
            <label class="form-label">Username</label>
            <input 
                type="text" 
                id="email" 
                class="form-input"
                placeholder="your@email.com"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input 
                type="password" 
                id="password" 
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
            >
        </div>

        <button class="btn-login" onclick="doLogin()">
            Sign In →
        </button>

        <div class="login-footer">
            © 2026 SMRITI Retail OS
        </div>
    </div>
</div>

<script>
document.getElementById('password')
    .addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doLogin();
    });

function doLogin() {
    const usr = document.getElementById('email').value;
    const pwd = document.getElementById('password').value;
    const err = document.getElementById('error-msg');
    
    if (!usr || !pwd) {
        err.style.display = 'block';
        err.textContent = 'Please enter credentials';
        return;
    }
    
    err.style.display = 'none';
    
    fetch('/api/method/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Frappe-CSRF-Token': 'fetch'
        },
        body: JSON.stringify({ usr, pwd })
    })
    .then(r => r.json())
    .then(data => {
        if (data.message === 'Logged In') {
            window.location.href = '/app';
        } else {
            err.style.display = 'block';
            err.textContent = 
                'Invalid credentials. Please try again.';
        }
    })
    .catch(() => {
        err.style.display = 'block';
        err.textContent = 'Connection error. Try again.';
    });
}
</script>
</body>
</html>
