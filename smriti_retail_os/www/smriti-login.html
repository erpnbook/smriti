<!DOCTYPE html>
<html>
<head>
    {%- include "smriti_retail_os/templates/includes/smriti_token_loader.html" -%}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMRITI Retail OS — Sign In</title>
    <link rel="icon" href="/assets/smriti_retail_os/images/smriti_logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: url('/assets/smriti_retail_os/images/login_wallpaper.svg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            width: 440px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .logo-row img {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        }
        .brand-text {
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        .brand-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #14b8a6; /* Teal color */
            letter-spacing: 1.5px;
            margin-top: 2px;
            line-height: 1;
        }
        .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper svg.field-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrapper input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .input-wrapper input:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }
        .input-wrapper input:focus {
            border-color: #14b8a6;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }
        .input-wrapper input:focus + svg.field-icon {
            color: #14b8a6;
        }
        .input-wrapper .eye-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .input-wrapper .eye-btn:hover {
            color: #ffffff;
        }
        .input-wrapper .eye-btn svg {
            width: 18px;
            height: 18px;
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            user-select: none;
        }
        .remember-me input {
            accent-color: #14b8a6;
            cursor: pointer;
            width: 15px;
            height: 15px;
        }
        .forgot-link {
            color: #14b8a6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #2dd4bf;
            text-decoration: underline;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #14b8a6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.2);
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover {
            background: #0d9488;
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.3);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            background: rgba(20, 184, 166, 0.4);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        .lang-row {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .lang-row:hover {
            color: #ffffff;
        }
        .lang-row svg {
            width: 14px;
            height: 14px;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }
        /* Chrome/Safari Autofill Styles override to match dark background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0 1000px rgba(15, 23, 42, 0.95) inset !important;
            border: 1.5px solid rgba(255, 255, 255, 0.08) !important;
            transition: background-color 50000s ease-in-out 0s;
        }
        input:-webkit-autofill:focus {
            border-color: #14b8a6 !important;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-area">
        <div class="logo-row">
            <img src="/assets/smriti_retail_os/images/smriti_logo.svg"
                 alt="SMRITI Logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <div class="brand-title">SMRITI</div>
                <div class="brand-subtitle">RETAIL OS</div>
            </div>
        </div>
        <p class="tagline">One Platform. Complete Retail Solution.</p>
    </div>

    <div class="error-box" id="err"></div>

    <div class="form-group">
        <label>Username / Email</label>
        <div class="input-wrapper">
            <input type="email" id="usr" placeholder="Username / Email" autocomplete="username">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </div>
    <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
            <input type="password" id="pwd" placeholder="Password" autocomplete="current-password">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <button class="eye-btn" id="eye-toggle" type="button" onclick="togglePassword()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div class="options-row">
        <label class="remember-me">
            <input type="checkbox" id="remember_me">
            Remember Me
        </label>
        <a href="#" class="forgot-link" onclick="forgotPassword(); return false;">Forgot Password?</a>
    </div>

    <button class="btn-login" id="btn" onclick="doLogin()">Login</button>

    <div class="lang-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        English (India) ∨
    </div>

    <div class="footer">© PrathamOne / AITDL — SMRITI Retail OS</div>
</div>

<script>
document.getElementById('pwd').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
});

function getCsrf() {
    var match = document.cookie.match(/csrf_token=([^;]+)/);
    return match ? match[1] : '';
}

function showErr(msg) {
    var el = document.getElementById('err');
    el.textContent   = msg;
    el.style.display = 'block';
}

function togglePassword() {
    var pwdInput = document.getElementById('pwd');
    var eyeBtn = document.getElementById('eye-toggle');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
        pwdInput.type = 'password';
        eyeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
}

function forgotPassword() {
    showErr('Please contact your administrator to reset your password.');
}

function doLogin() {
    var btn = document.getElementById('btn');
    var usr = document.getElementById('usr').value.trim();
    var pwd = document.getElementById('pwd').value;
    document.getElementById('err').style.display = 'none';

    if (!usr || !pwd) { showErr('Please enter email and password.'); return; }

    btn.disabled    = true;
    btn.textContent = 'Signing in...';

    fetch('/api/method/login', {
        method: 'POST',
        headers: {
            'Content-Type':       'application/json',
            'X-Frappe-CSRF-Token': getCsrf()
        },
        credentials: 'include',
        body: JSON.stringify({ usr: usr, pwd: pwd })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.message === 'Logged In') {
            return fetch(
                '/api/method/smriti_retail_os.boot.get_smriti_session_info',
                { credentials: 'include' }
            )
            .then(function(r) { return r.json(); })
            .then(function(info) {
                var route = '/smriti';
                if (info.message && info.message.default_route) {
                    route = info.message.default_route;
                }
                // Validate route exists before redirect
                _validateAndRedirect(route);
            });
        } else {
            showErr(data.message || 'Invalid credentials.');
            btn.disabled    = false;
            btn.textContent = 'Login';
        }
    })
    .catch(function() {
        showErr('Connection error. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Login';
    });
}

function _validateAndRedirect(route) {
    // Validate the target route before redirecting
    // Prevents redirect loops if a SMRITI page is missing
    var knownRoutes = ['/smriti', '/billing', '/inventory', '/reports', '/psa'];
    var isKnown = knownRoutes.some(function(r) {
        return route.startsWith(r);
    });
    if (!isKnown) {
        route = '/smriti';  // Safe fallback
    }
    window.location.href = route;
}
</script>
</body>
</html>
