<!--
  @file: smriti_retail_os/templates/includes/smriti_topbar.html
  @description: SMRITI Midnight Topbar -- fixed top navigation bar.
                Include ONCE per page inside .smriti-main div, before .smriti-content.
  @governance: UI-GOV-005 compliant -- all colors via var(--smriti-*)
  @usage: See project documentation for inclusion guidelines.
  @sprint: UI-MIDNIGHT-001
-->

<style>
/* ═══════════════════════════════════════════════════════
   SMRITI Topbar — Midnight Edition
   UI-GOV-005: zero hardcoded colors
═══════════════════════════════════════════════════════ */
.smriti-topbar {
    position: sticky;
    top: 0;
    height: var(--smriti-toolbar-height);
    background: var(--smriti-color-bg-primary);
    border-bottom: 1px solid var(--smriti-color-border-default);
    display: flex;
    align-items: center;
    padding: 0 var(--smriti-spacing-section);
    gap: var(--smriti-spacing-lg);
    z-index: var(--smriti-z-index-sticky);
    flex-shrink: 0;
}

/* ── Page title breadcrumb ── */
.topbar-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.topbar-page-title {
    font-family: 'Outfit', sans-serif;
    font-size: var(--smriti-font-size-md);
    font-weight: 600;
    color: var(--smriti-color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.topbar-breadcrumb-sep {
    color: var(--smriti-color-text-subtle);
    font-size: var(--smriti-font-size-sm);
}

.topbar-breadcrumb-parent {
    font-size: var(--smriti-font-size-sm);
    color: var(--smriti-color-text-muted);
    text-decoration: none;
    white-space: nowrap;
}

.topbar-breadcrumb-parent:hover {
    color: var(--smriti-color-brand-primary);
}

/* ── Spacer ── */
.topbar-spacer { flex: 1; }

/* ── Search ── */
.topbar-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--smriti-color-bg-secondary);
    border: 1px solid var(--smriti-color-border-default);
    border-radius: var(--smriti-radius-md);
    padding: 0 12px;
    height: 32px;
    width: 220px;
    cursor: pointer;
    transition: border-color 0.15s ease, width 0.2s ease;
}

.topbar-search:hover {
    border-color: var(--smriti-color-border-strong);
    width: 260px;
}

.topbar-search svg {
    width: 14px;
    height: 14px;
    color: var(--smriti-color-text-subtle);
    flex-shrink: 0;
}

.topbar-search-text {
    font-size: var(--smriti-font-size-xs);
    color: var(--smriti-color-text-subtle);
    flex: 1;
}

.topbar-search-kbd {
    font-size: 0.65rem;
    color: var(--smriti-color-text-subtle);
    background: var(--smriti-color-bg-elevated);
    border: 1px solid var(--smriti-color-border-strong);
    border-radius: 3px;
    padding: 1px 5px;
    white-space: nowrap;
}

/* ── Actions group ── */
.topbar-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}

.topbar-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid transparent;
    border-radius: var(--smriti-radius-sm);
    cursor: pointer;
    color: var(--smriti-color-text-muted);
    position: relative;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.topbar-btn:hover {
    background: var(--smriti-color-bg-secondary);
    color: var(--smriti-color-text-primary);
    border-color: var(--smriti-color-border-default);
}

.topbar-btn svg { width: 16px; height: 16px; }

/* Notification badge */
.topbar-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 8px;
    height: 8px;
    background: var(--smriti-color-status-danger);
    border-radius: 50%;
    border: 2px solid var(--smriti-color-bg-primary);
}

/* ── Status pill (Live indicator) ── */
.topbar-status {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--smriti-color-status-success-bg);
    border: 1px solid var(--smriti-color-status-success-border);
    border-radius: var(--smriti-radius-full);
    padding: 3px 10px;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--smriti-color-status-success);
    white-space: nowrap;
}

.topbar-status-dot {
    width: 6px;
    height: 6px;
    background: var(--smriti-color-status-success);
    border-radius: 50%;
    animation: pulse-dot 2s ease infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.6; transform: scale(0.85); }
}

/* ── User chip ── */
.topbar-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--smriti-color-bg-secondary);
    border: 1px solid var(--smriti-color-border-default);
    border-radius: var(--smriti-radius-md);
    padding: 4px 10px 4px 6px;
    cursor: pointer;
    transition: border-color 0.15s ease;
}

.topbar-user:hover { border-color: var(--smriti-color-brand-primary); }

.topbar-user-avatar {
    width: 22px;
    height: 22px;
    background: var(--smriti-color-brand-secondary, #6941C6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--smriti-color-text-primary);
}

.topbar-user-name {
    font-size: var(--smriti-font-size-xs);
    font-weight: 600;
    color: var(--smriti-color-text-primary);
    white-space: nowrap;
}

.topbar-user-chevron {
    width: 12px;
    height: 12px;
    color: var(--smriti-color-text-subtle);
}

/* ── Shift status pill ── */
.shift-status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--smriti-color-bg-secondary);
    border: 1px solid var(--smriti-color-border-default);
    border-radius: var(--smriti-radius-full);
    padding: 3px 10px;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--smriti-color-text-muted);
    white-space: nowrap;
}
.shift-status-badge.open {
    border-color: var(--smriti-color-status-success-border);
    background: var(--smriti-color-status-success-bg);
    color: var(--smriti-color-status-success);
}
.shift-status-badge.closed {
    border-color: var(--smriti-color-status-danger-border);
    background: var(--smriti-color-status-danger-bg);
    color: var(--smriti-color-status-danger);
}
.shift-status-badge .dot {
    width: 6px;
    height: 6px;
    background-color: currentColor;
    border-radius: 50%;
}
</style>

<header class="smriti-topbar" id="smriti-topbar">

    <!-- Breadcrumb -->
    <div class="topbar-breadcrumb">
        <span class="topbar-page-title" id="topbar-page-title">Dashboard</span>
    </div>

    <div class="topbar-spacer"></div>

    <!-- Search -->
    <div class="topbar-search" id="topbar-search" role="search" tabindex="0" aria-label="Search SMRITI" onclick="if(window.SMRITI && SMRITI.CommandPalette) SMRITI.CommandPalette.open();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="topbar-search-text">Search or type a command</span>
        <span class="topbar-search-kbd">Ctrl+K</span>
    </div>

    <!-- Actions -->
    <div class="topbar-actions">

        <!-- Shift status pill -->
        <div class="shift-status-badge closed" id="shift-badge">
            <div class="dot"></div>
            <span id="shift-badge-text">Checking Shift...</span>
        </div>

        <!-- Live status -->
        <div class="topbar-status">
            <div class="topbar-status-dot"></div>
            Live
        </div>

        <!-- Notifications -->
        <button class="topbar-btn" id="topbar-notif-btn" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="topbar-badge" id="notif-badge" style="display:none"></span>
        </button>

        <!-- Help -->
        <button class="topbar-btn" aria-label="Help" title="Help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </button>

        <!-- User chip -->
        <div class="topbar-user" id="topbar-user-chip">
            <div class="topbar-user-avatar" id="topbar-avatar">JM</div>
            <span class="topbar-user-name" id="topbar-username">User</span>
            <svg class="topbar-user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </div>

    </div>

</header>

<script>
(function() {
    'use strict';

    /* ── 1. Set page title ── */
    var titleEl = document.getElementById('topbar-page-title');
    if (titleEl) {
        titleEl.textContent = document.body.dataset.pageTitle
            || document.title.split(' — ')[0]
            || document.title.split(' - ')[0]
            || 'Dashboard';
    }

    /* ── 2. Populate user chip ── */
    function _hydrateUser() {
        try {
            var session = window.frappe && window.frappe.session;
            if (!session) return;
            var name     = session.user_fullname || session.user || 'User';
            var initials = name.split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0, 2) || 'U';
            var nameEl   = document.getElementById('topbar-username');
            var avatarEl = document.getElementById('topbar-avatar');
            if (nameEl)   nameEl.textContent   = name.split(' ')[0];
            if (avatarEl) avatarEl.textContent  = initials;
        } catch(e) {}
    }
    _hydrateUser();
    /* Retry once Frappe session is fully ready */
    document.addEventListener('DOMContentLoaded', _hydrateUser);

    /* ── 3. Notification badge hydration ── */
    function _hydrateBadge() {
        var badge = document.getElementById('notif-badge');
        if (!badge) return;
        try {
            frappe.call({
                method: 'smriti_retail_os.notification_studio.api.notifications.get_unread_count',
                callback: function(r) {
                    if (r && r.message && r.message.count > 0) {
                        badge.textContent = r.message.count > 9 ? '9+' : String(r.message.count);
                        badge.style.display = 'flex';
                        badge.style.alignItems = 'center';
                        badge.style.justifyContent = 'center';
                        badge.style.fontSize = '9px';
                        badge.style.width = '16px';
                        badge.style.height = '16px';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            });
        } catch(e) {}
    }
    setTimeout(_hydrateBadge, 1200);

    /* ── 4. Notification bell → /smriti-notifications ── */
    var notifBtn = document.getElementById('topbar-notif-btn');
    if (notifBtn) {
        notifBtn.addEventListener('click', function() {
            window.location.href = '/smriti-notifications';
        });
        notifBtn.style.cursor = 'pointer';
    }

    /* ── 5. User chip → /smriti-profile ── */
    var userChip = document.getElementById('topbar-user-chip');
    if (userChip) {
        userChip.addEventListener('click', function() {
            window.location.href = '/smriti-profile';
        });
        userChip.style.cursor = 'pointer';
    }

    /* ── 6. Help button → /smriti-help ── */
    var helpBtns = document.querySelectorAll('.topbar-btn[aria-label="Help"]');
    helpBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            window.location.href = '/smriti-help';
        });
    });

    /* ── 7. Search box — open SMRITI search modal ── */
    var searchBox = document.getElementById('topbar-search');
    function _openSearch() {
        /* If smriti_topbar.js is loaded and has a search modal, trigger it */
        if (window.SMRITI_TOPBAR && window.SMRITI_TOPBAR.openSearch) {
            window.SMRITI_TOPBAR.openSearch();
            return;
        }
        /* Fallback: open a lightweight search modal inline */
        var existing = document.getElementById('smriti-search-modal-overlay');
        if (existing) { existing.style.display = 'flex'; return; }
        var overlay = document.createElement('div');
        overlay.id = 'smriti-search-modal-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;background:var(--smriti-overlay-bg,rgba(0,0,0,0.65));backdrop-filter:blur(4px);';
        overlay.innerHTML = [
            '<div style="width:560px;max-width:94vw;background:var(--smriti-color-bg-elevated);border:1px solid var(--smriti-color-border-default);border-radius:14px;box-shadow:0 32px 80px var(--smriti-shadow-heavy,rgba(0,0,0,0.7));overflow:hidden;">',
            '  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--smriti-color-border-subtle);">',
            '    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--smriti-color-text-subtle)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
            '    <input id="smriti-search-field" placeholder="Search pages, items, customers..." autocomplete="off" style="flex:1;background:none;border:none;outline:none;color:var(--smriti-color-text-primary);font-size:14px;font-family:Arial,sans-serif;">',
            '    <kbd style="background:var(--smriti-color-bg-secondary);border:1px solid var(--smriti-color-border-default);border-radius:4px;color:var(--smriti-color-text-subtle);font-size:10px;padding:2px 6px;">Esc</kbd>',
            '  </div>',
            '  <div id="smriti-search-results-list" style="max-height:360px;overflow-y:auto;padding:8px 0;">',
            '    <div style="padding:20px;text-align:center;color:var(--smriti-color-text-subtle);font-size:13px;">Type to search SMRITI...</div>',
            '  </div>',
            '</div>'
        ].join('');

        /* Close on overlay click or Escape */
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.style.display = 'none';
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') overlay.style.display = 'none';
        });

        document.body.appendChild(overlay);

        var field = document.getElementById('smriti-search-field');
        var resultsList = document.getElementById('smriti-search-results-list');
        field.focus();

        /* Quick nav items */
        var NAV_SHORTCUTS = [
            { label: 'Control Center',   icon: '🏠', url: '/smriti' },
            { label: 'Retail Billing',   icon: '🧾', url: '/billing' },
            { label: 'Inventory Ops',    icon: '📦', url: '/inventory' },
            { label: 'Purchase Studio',  icon: '🛒', url: '/smriti-purchase' },
            { label: 'Reports',          icon: '📊', url: '/reports' },
            { label: 'Customers',        icon: '👥', url: '/customers' },
            { label: 'Suppliers',        icon: '🏭', url: '/suppliers' },
            { label: 'Notifications',    icon: '🔔', url: '/smriti-notifications' },
            { label: 'My Profile',       icon: '👤', url: '/smriti-profile' },
            { label: 'Help',             icon: '❓', url: '/smriti-help' },
        ];

        function _renderQuickNav(query) {
            var items = query
                ? NAV_SHORTCUTS.filter(function(n){ return n.label.toLowerCase().includes(query.toLowerCase()); })
                : NAV_SHORTCUTS;
            if (!items.length) {
                resultsList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--smriti-color-text-subtle);font-size:13px;">No results found</div>';
                return;
            }
            resultsList.innerHTML = items.map(function(n) {
                return '<div onclick="window.location.href=\'' + n.url + '\'" style="display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background 0.1s;" onmouseover="this.style.background=\'var(--smriti-color-brand-muted,rgba(37,99,235,0.1))\'" onmouseout="this.style.background=\'\'"><span style="font-size:18px;">' + n.icon + '</span><span style="font-size:13px;color:var(--smriti-color-text-primary);">' + n.label + '</span></div>';
            }).join('');
        }
        _renderQuickNav('');

        field.addEventListener('input', function() { _renderQuickNav(field.value); });
        field.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') overlay.style.display = 'none';
            if (e.key === 'Enter') {
                var first = resultsList.querySelector('[onclick]');
                if (first) first.click();
            }
        });
    }

    if (searchBox) {
        searchBox.addEventListener('click', _openSearch);
        searchBox.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') _openSearch();
        });
        searchBox.style.cursor = 'pointer';
    }

    /* ── 8. Global Ctrl+G shortcut → open search ── */
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'g') {
            e.preventDefault();
            _openSearch();
        }
    });

})();
</script>
