<!--
  @file: smriti_retail_os/templates/includes/smriti_sidebar.html
  @description: SMRITI Midnight Sidebar -- fixed left navigation chrome.
                Include ONCE per page inside .smriti-shell div.
  @governance: UI-GOV-005 compliant -- all colors via var(--smriti-*)
  @usage: {%- include "smriti_retail_os/templates/includes/smriti_sidebar.html" -%}
  @sprint: UI-MIDNIGHT-001
-->

<style>
/* ═══════════════════════════════════════════════════════
   SMRITI Sidebar — Midnight Edition
   UI-GOV-005: zero hardcoded colors
═══════════════════════════════════════════════════════ */
.smriti-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--smriti-dimension-sidebar-width);
    height: 100vh;
    background: var(--smriti-color-bg-primary);
    border-right: 1px solid var(--smriti-color-border-default);
    display: flex;
    flex-direction: column;
    z-index: var(--smriti-z-index-sidebar);
    transition: width 0.25s ease;
    overflow: hidden;
}

.smriti-sidebar.collapsed {
    width: var(--smriti-dimension-sidebar-collapsed-width);
}

/* ── Logo Bar ── */
.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    height: var(--smriti-toolbar-height);
    border-bottom: 1px solid var(--smriti-color-border-default);
    flex-shrink: 0;
    text-decoration: none;
}

.sidebar-logo-mark {
    width: 28px;
    height: 28px;
    background: var(--smriti-color-status-info-bg);
    border: 1px solid var(--smriti-color-status-info-border);
    border-radius: var(--smriti-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.sidebar-logo-mark svg { width: 16px; height: 16px; }

.sidebar-logo-text {
    font-family: 'Outfit', sans-serif;
    font-size: var(--smriti-font-size-base);
    font-weight: 700;
    color: var(--smriti-color-text-primary);
    white-space: nowrap;
    overflow: hidden;
}

.sidebar-logo-text span {
    color: var(--smriti-color-brand-primary);
}

/* ── Nav Sections ── */
.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 0;
}

.nav-section-label {
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--smriti-color-text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 12px 16px 4px;
    white-space: nowrap;
    overflow: hidden;
}

.sidebar-collapsed .nav-section-label { opacity: 0; }

/* ── Nav Item ── */
.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    color: var(--smriti-color-text-muted);
    text-decoration: none;
    font-size: var(--smriti-font-size-sm);
    font-weight: 500;
    border-radius: 0;
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
}

.nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    transition: color 0.15s ease;
}

.nav-item:hover {
    background: var(--smriti-color-bg-secondary);
    color: var(--smriti-color-text-primary);
}

.nav-item.active {
    background: var(--smriti-color-status-info-bg);
    color: var(--smriti-color-brand-primary);
    font-weight: 600;
}

/* Active left indicator */
.nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 3px;
    background: var(--smriti-color-brand-primary);
    border-radius: 0 3px 3px 0;
}

/* ── Sidebar Footer ── */
.sidebar-footer {
    border-top: 1px solid var(--smriti-color-border-default);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.sidebar-user-avatar {
    width: 28px;
    height: 28px;
    background: var(--smriti-color-brand-secondary, #6941C6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--smriti-color-text-primary);
    flex-shrink: 0;
}

.sidebar-user-info {
    min-width: 0;
    overflow: hidden;
}

.sidebar-user-name {
    font-size: var(--smriti-font-size-xs);
    font-weight: 600;
    color: var(--smriti-color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-user-role {
    font-size: 0.68rem;
    color: var(--smriti-color-text-subtle);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ── Collapse toggle ── */
.sidebar-collapse-btn {
    background: none;
    border: 1px solid var(--smriti-color-border-default);
    border-radius: var(--smriti-radius-sm);
    cursor: pointer;
    color: var(--smriti-color-text-subtle);
    padding: 4px;
    display: flex;
    margin-left: auto;
    flex-shrink: 0;
    transition: color 0.15s ease, border-color 0.15s ease;
}

.sidebar-collapse-btn:hover {
    color: var(--smriti-color-brand-primary);
    border-color: var(--smriti-color-brand-primary);
}

.sidebar-collapse-btn svg { width: 14px; height: 14px; }
</style>

<aside class="smriti-sidebar" id="smriti-sidebar" role="navigation" aria-label="SMRITI Navigation">

    <!-- Logo -->
    <a class="sidebar-logo" href="/smriti" id="sidebar-logo-link">
        <div class="sidebar-logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--smriti-color-brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                <path d="M2 17L12 22L22 17" opacity="0.7"/>
                <path d="M2 12L12 17L22 12" opacity="0.4"/>
            </svg>
        </div>
        <span class="sidebar-logo-text">SMRITI <span>Retail OS</span></span>
    </a>

    <!-- Nav -->
    <nav class="sidebar-nav" id="sidebar-nav">

        <div class="nav-section-label">Modules</div>

        <a class="nav-item" href="/smriti" id="nav-dashboard" data-route="smriti">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            <span>Dashboard</span>
        </a>

        <a class="nav-item" href="/inventory" id="nav-inventory" data-route="inventory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
            <span>Inventory</span>
        </a>

        <a class="nav-item" href="/billing" id="nav-billing" data-route="billing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>Billing</span>
        </a>

        <a class="nav-item" href="/purchase" id="nav-purchase" data-route="purchase">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span>Purchase</span>
        </a>

        <div class="nav-section-label">Analytics</div>

        <a class="nav-item" href="/reports" id="nav-reports" data-route="reports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Reports</span>
        </a>

        <a class="nav-item" href="/smriti-psv-dashboard" id="nav-psv" data-route="smriti-psv-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span>PSV</span>
        </a>

        <div class="nav-section-label">Setup</div>

        <a class="nav-item" href="/smriti-settings" id="nav-settings" data-route="smriti-settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
            </svg>
            <span>Settings</span>
        </a>

        <div class="nav-section-label">Commercial</div>

        <a class="nav-item" href="/smriti-trial-leads" id="nav-trial-leads" data-route="smriti-trial-leads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Trial CRM</span>
        </a>

        <a class="nav-item" href="/smriti-platform-admin" id="nav-platform-admin" data-route="smriti-platform-admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
            <span>Platform Admin</span>
        </a>

    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
        <div class="sidebar-user-avatar" id="sidebar-avatar">JM</div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-username">Loading…</div>
            <div class="sidebar-user-role" id="sidebar-userrole">SMRITI Retail OS</div>
        </div>
        <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
    </div>

</aside>

<script>
(function() {
    /* ── Active nav item by current path ── */
    var path = window.location.pathname.replace(/\/$/, '') || '/smriti';
    document.querySelectorAll('.nav-item[data-route]').forEach(function(el) {
        var route = '/' + el.dataset.route;
        if (path === route || path.startsWith(route + '/')) {
            el.classList.add('active');
        }
    });

    /* ── Collapse toggle ── */
    var sidebar  = document.getElementById('smriti-sidebar');
    var main     = document.querySelector('.smriti-main');
    var colBtn   = document.getElementById('sidebar-collapse-btn');
    var collapsed = localStorage.getItem('smriti-sidebar-collapsed') === 'true';

    function applyCollapse(c) {
        sidebar.classList.toggle('collapsed', c);
        if (main) main.classList.toggle('sidebar-collapsed', c);
        colBtn.querySelector('polyline').setAttribute('points', c ? '9 18 15 12 9 6' : '15 18 9 12 15 6');
    }

    applyCollapse(collapsed);

    colBtn.addEventListener('click', function() {
        collapsed = !collapsed;
        localStorage.setItem('smriti-sidebar-collapsed', collapsed);
        applyCollapse(collapsed);
    });

    /* ── User info from frappe session ── */
    try {
        if (window.frappe && window.frappe.session) {
            var name = window.frappe.session.user_fullname || window.frappe.session.user || '';
            var initials = name.split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2);
            document.getElementById('sidebar-username').textContent = name;
            document.getElementById('sidebar-avatar').textContent   = initials || 'U';
            var roles = window.frappe.user_roles || [];
            if (roles.length) {
                document.getElementById('sidebar-userrole').textContent = roles[0];
            }
        }
    } catch(e) {}
})();
</script>
