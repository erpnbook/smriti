<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read-Only Mode — SMRITI Retail OS</title>
    <link rel="stylesheet" href="/status/assets/styles.css">
    <script src="/status/assets/status.js" defer></script>
</head>
<body class="theme-purple">
    <div class="status-container">
        <div class="logo-section">
            <div class="logo-text">
                SMRITI <span class="logo-tag">Secure</span>
            </div>
        </div>
        
        <div class="status-indicator">
            <div class="indicator-pulse"></div>
            <div class="indicator-core"></div>
        </div>
        
        <h1 class="status-title">System in Read-Only Mode</h1>
        <p class="status-message">
            SMRITI Retail OS is currently undergoing a system check or license update. Databases are locked for writing to prevent synchronization drift. You can still view reports and catalog records.
        </p>
        
        <div class="footer-section">
            <span>SMRITI System Status | Framework SSMF v1.0</span>
            <span class="footer-code">MAINT-004</span>
        </div>
    </div>
</body>
</html>
