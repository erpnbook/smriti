<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Canvas Background -->
    <linearGradient id="simple-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Deep Violet Accent Ribbon -->
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="clean-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#simple-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ultra-Clean Iconic "S" Ribbon Monogram -->
  <g filter="url(#clean-glow)">
    <!-- Primary Cyan Stroke Path -->
    <path d="M 336 176 C 336 128, 176 128, 176 200 C 176 280, 336 232, 336 312 C 336 384, 176 384, 176 336" 
          fill="none" stroke="url(#neon-cyan)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Overlaid Purple Core Ribbon -->
    <path d="M 336 176 C 336 128, 176 128, 176 200 C 176 280, 336 232, 336 312 C 336 384, 176 384, 176 336" 
          fill="none" stroke="url(#neon-purple)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Glowing System Node Dots -->
  <circle cx="336" cy="176" r="22" fill="#00F2FE" filter="url(#clean-glow)" />
  <circle cx="336" cy="176" r="10" fill="#FFFFFF" />

  <circle cx="176" cy="336" r="22" fill="#C084FC" filter="url(#clean-glow)" />
  <circle cx="176" cy="336" r="10" fill="#FFFFFF" />

  <!-- Clean Minimalist Brand Text "smritiSYS" -->
  <text x="256" y="440" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="38" letter-spacing="1">
    <tspan fill="#FFFFFF">smriti</tspan>
    <tspan fill="#00F2FE" font-weight="900">SYS</tspan>
  </text>
</svg>
